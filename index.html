<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Obsidian Lab — Paper Trading</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0e14; color: #e2e8f0; font-family: sans-serif; }
  </style>
</head>
<body class="p-4 flex flex-col min-h-screen justify-between relative">

  <!-- Header & Balans -->
  <div>
    <div class="flex justify-between items-center mb-4">
      <div>
        <p class="text-xs text-gray-400 font-semibold tracking-wider">OBSIDIAN LAB</p>
        <h1 class="text-lg font-bold text-white tracking-wide">Paper Trading</h1>
      </div>
      <div class="text-right">
        <p class="text-xs text-gray-400">Virtual Balans</p>
        <p id="balance" class="text-xl font-bold text-emerald-400">$10,000.00</p>
      </div>
    </div>

    <!-- Aktiv Tanlash -->
    <div class="grid grid-cols-2 gap-2 mb-4 bg-slate-900 p-1 rounded-xl border border-slate-800">
      <button id="btn-btc" onclick="switchAsset('BTCUSDT')" class="py-2 text-sm font-semibold rounded-lg bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 transition">
        BTC / USDT
      </button>
      <button id="btn-eth" onclick="switchAsset('ETHUSDT')" class="py-2 text-sm font-semibold rounded-lg text-gray-400 transition">
        ETH / USDT
      </button>
    </div>

    <!-- Narx Ko'rsatkichi -->
    <div class="bg-slate-900/80 border border-slate-800 p-5 rounded-2xl text-center mb-4 shadow-lg">
      <p id="pair-label" class="text-xs text-gray-400 uppercase tracking-widest mb-1">BTC/USDT Narxi</p>
      <div id="price" class="text-3xl font-extrabold text-white tracking-tight">Yuklanmoqda...</div>
      <span class="inline-block mt-2 px-2.5 py-0.5 text-xs rounded-full bg-emerald-500/10 text-emerald-400 font-medium">Binance Live</span>
    </div>

    <!-- Ochiq Pozitsiya Card -->
    <div id="position-card" class="hidden bg-slate-900 border border-slate-800 p-4 rounded-xl mb-4">
      <div class="flex justify-between text-xs text-gray-400 mb-2">
        <span>Pozitsiya: <b id="pos-type" class="text-white"></b></span>
        <span>Hajm: <b id="pos-size" class="text-white"></b></span>
      </div>
      <div class="flex justify-between text-xs text-gray-400 mb-2">
        <span>Kirish narxi: <b id="pos-entry" class="text-white"></b></span>
      </div>
      <div class="flex justify-between items-center mt-3 pt-2 border-t border-slate-800">
        <div>
          <p class="text-xs text-gray-400">Jonli PnL:</p>
          <p id="pos-pnl" class="text-lg font-bold">$0.00 (0.00%)</p>
        </div>
        <button onclick="closePosition()" class="bg-rose-500/20 text-rose-400 border border-rose-500/30 px-4 py-2 rounded-lg text-xs font-semibold active:scale-95 transition">
          Yopish
        </button>
      </div>
    </div>
  </div>

  <!-- Pastki qism: Savdo Hajmi va Tugmalar -->
  <div class="mt-auto pt-2">
    <div class="bg-slate-900/70 border border-slate-800 p-3 rounded-xl mb-3">
      <div class="flex justify-between items-center mb-2">
        <label class="text-xs text-gray-400 font-medium">Savdo hajmi ($):</label>
        <span id="size-percent" class="text-[11px] text-gray-500">10% balansdan</span>
      </div>
      
      <div class="relative mb-2">
        <span class="absolute left-3 top-2 text-gray-400 font-bold">$</span>
        <input 
          id="order-size-input" 
          type="number" 
          value="1000" 
          min="10" 
          oninput="onManualSizeChange()"
          class="w-full bg-slate-950 border border-slate-800 rounded-lg py-1.5 pl-8 pr-3 text-sm text-white font-semibold focus:outline-none focus:border-emerald-500"
        />
      </div>

      <div class="grid grid-cols-4 gap-1.5">
        <button onclick="setPercentSize(0.1)" class="py-1 bg-slate-800 hover:bg-slate-700 text-xs rounded text-gray-300 active:scale-95 transition">10%</button>
        <button onclick="setPercentSize(0.25)" class="py-1 bg-slate-800 hover:bg-slate-700 text-xs rounded text-gray-300 active:scale-95 transition">25%</button>
        <button onclick="setPercentSize(0.5)" class="py-1 bg-slate-800 hover:bg-slate-700 text-xs rounded text-gray-300 active:scale-95 transition">50%</button>
        <button onclick="setPercentSize(1.0)" class="py-1 bg-slate-800 hover:bg-slate-700 text-xs rounded text-amber-400 font-semibold active:scale-95 transition">100%</button>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <button onclick="openPosition('LONG')" class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 transition text-slate-950 font-bold py-3.5 rounded-xl flex flex-col items-center justify-center">
        <span class="text-sm">LONG 🟢</span>
        <span class="text-[10px] opacity-80">O'sishga</span>
      </button>
      <button onclick="openPosition('SHORT')" class="bg-rose-500 hover:bg-rose-600 active:scale-95 transition text-white font-bold py-3.5 rounded-xl flex flex-col items-center justify-center">
        <span class="text-sm">SHORT 🔴</span>
        <span class="text-[10px] opacity-80">Tushishga</span>
      </button>
    </div>
  </div>

  <!-- Likvidatsiya Modali -->
  <div id="liquidation-modal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-rose-500/40 p-6 rounded-2xl max-w-xs text-center shadow-2xl">
      <div class="text-4xl mb-2">💥</div>
      <h2 class="text-rose-500 font-extrabold text-xl tracking-wider uppercase mb-2">Likvidatsiya!</h2>
      <p class="text-xs text-slate-300 mb-4 leading-relaxed">
        Obsidian AI: <br>
        <span class="italic text-gray-400">"Jigar, depozit toza bo'ldi. Risk-menejmentsiz bozor xomxayollarni kechirmaydi!"</span>
      </p>
      <button onclick="resetBalance()" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl text-sm transition active:scale-95">
        Qayta urinish ($10,000 olish) 🔄
      </button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    // Foydalanuvchi prefiksi (qurilmalar va foydalanuvchilar aralashib ketmasligi uchun)
    const userId = tg?.initDataUnsafe?.user?.id || 'default_user';
    const KEY_BALANCE = `obs_bal_${userId}`;
    const KEY_POSITION = `obs_pos_${userId}`;

    let balance = 10000;
    let currentAsset = 'BTCUSDT';
    const prices = { BTCUSDT: 0, ETHUSDT: 0 };
    let position = null;

    // Doimiy xotiraga yozish (Ikkala joyga ham)
    function persistData(key, value) {
      const valStr = typeof value === 'object' ? JSON.stringify(value) : value.toString();
      localStorage.setItem(key, valStr);
      try {
        if (tg?.CloudStorage) tg.CloudStorage.setItem(key, valStr);
      } catch (e) {}
    }

    // Xotiradan o'qish
    function initData() {
      const localBal = localStorage.getItem(KEY_BALANCE);
      const localPos = localStorage.getItem(KEY_POSITION);

      if (localBal !== null) {
        balance = parseFloat(localBal);
      } else {
        balance = 10000;
        persistData(KEY_BALANCE, balance);
      }

      if (localPos) {
        try {
          const parsed = JSON.parse(localPos);
          if (parsed && parsed.size > 0) position = parsed;
        } catch (e) {
          position = null;
        }
      }

      // CloudStorage orqali yangiroq ma'lumot bo'lsa tekshirib olish
      if (tg?.CloudStorage) {
        tg.CloudStorage.getItems([KEY_BALANCE, KEY_POSITION], (err, res) => {
          if (!err && res) {
            if (res[KEY_BALANCE]) {
              balance = parseFloat(res[KEY_BALANCE]);
              localStorage.setItem(KEY_BALANCE, res[KEY_BALANCE]);
            }
            if (res[KEY_POSITION]) {
              try {
                position = JSON.parse(res[KEY_POSITION]);
                localStorage.setItem(KEY_POSITION, res[KEY_POSITION]);
              } catch(e) {}
            }
            applyUI();
          }
        });
      }

      applyUI();
    }

    function applyUI() {
      document.getElementById('balance').innerText = "$" + balance.toFixed(2);
      setPercentSize(0.1);
      checkLiquidationStatus();

      if (position) {
        if (position.asset !== currentAsset) switchAsset(position.asset);
        document.getElementById('pos-type').innerText = `${position.type} (${position.asset === 'BTCUSDT' ? 'BTC' : 'ETH'})`;
        document.getElementById('pos-size').innerText = "$" + position.size.toFixed(2);
        document.getElementById('pos-entry').innerText = "$" + position.entryPrice.toLocaleString(undefined, {minimumFractionDigits: 2});
        document.getElementById('position-card').classList.remove('hidden');
      } else {
        document.getElementById('position-card').classList.add('hidden');
      }
    }

    function startBinanceFeed() {
      const ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade/ethusdt@trade');
      
      ws.onmessage = (e) => {
        const data = JSON.parse(e.data);
        const symbol = data.s;
        const price = parseFloat(data.p);

        prices[symbol] = price;

        if (currentAsset === symbol) {
          updatePriceUI(price);
        }
      };
    }

    function switchAsset(asset) {
      if (position && position.asset !== asset) {
        alert("Ochiq pozitsiyangiz mavjud! Avval uni yoping.");
        return;
      }
      currentAsset = asset;
      const btcBtn = document.getElementById('btn-btc');
      const ethBtn = document.getElementById('btn-eth');
      const pairLabel = document.getElementById('pair-label');

      if (asset === 'BTCUSDT') {
        pairLabel.innerText = "BTC/USDT Narxi";
        btcBtn.className = "py-2 text-sm font-semibold rounded-lg bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 transition";
        ethBtn.className = "py-2 text-sm font-semibold rounded-lg text-gray-400 transition";
      } else {
        pairLabel.innerText = "ETH/USDT Narxi";
        ethBtn.className = "py-2 text-sm font-semibold rounded-lg bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 transition";
        btcBtn.className = "py-2 text-sm font-semibold rounded-lg text-gray-400 transition";
      }

      if (prices[currentAsset] > 0) updatePriceUI(prices[currentAsset]);
    }

    function updatePriceUI(price) {
      document.getElementById('price').innerText = "$" + price.toLocaleString(undefined, {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });

      if (position && position.asset === currentAsset) {
        calculatePnL(price);
      }
    }

    function setPercentSize(ratio) {
      const calculated = Math.floor(balance * ratio);
      document.getElementById('order-size-input').value = calculated;
      document.getElementById('size-percent').innerText = `${Math.round(ratio * 100)}% balansdan`;
    }

    function onManualSizeChange() {
      const inputVal = parseFloat(document.getElementById('order-size-input').value) || 0;
      if (balance > 0) {
        const pct = ((inputVal / balance) * 100).toFixed(0);
        document.getElementById('size-percent').innerText = `${pct}% balansdan`;
      }
    }

    function openPosition(type) {
      if (position) {
        alert("Sizda allaqachon ochiq pozitsiya bor!");
        return;
      }
      const livePrice = prices[currentAsset];
      if (!livePrice || livePrice <= 0) return;

      const orderSize = parseFloat(document.getElementById('order-size-input').value) || 0;

      if (orderSize < 10) {
        alert("Minimal savdo hajmi: $10");
        return;
      }
      if (orderSize > balance) {
        alert("Mablag' yetarli emas! Balansingiz: $" + balance.toFixed(2));
        return;
      }

      balance -= orderSize;
      persistData(KEY_BALANCE, balance);
      document.getElementById('balance').innerText = "$" + balance.toFixed(2);

      position = {
        type: type,
        entryPrice: livePrice,
        size: orderSize,
        asset: currentAsset
      };
      persistData(KEY_POSITION, position);

      applyUI();
    }

    function calculatePnL(currentPrice) {
      let diff = (currentPrice - position.entryPrice) / position.entryPrice;
      if (position.type === 'SHORT') diff = -diff;

      const pnlUSD = position.size * diff;
      const pnlPercent = diff * 100;
      const pnlEl = document.getElementById('pos-pnl');

      pnlEl.innerText = `${pnlUSD >= 0 ? '+' : ''}$${pnlUSD.toFixed(2)} (${pnlPercent.toFixed(2)}%)`;
      pnlEl.className = pnlUSD >= 0 ? 'text-lg font-bold text-emerald-400' : 'text-lg font-bold text-rose-400';

      if (pnlPercent <= -100) {
        closePosition(true);
      }
    }

    function closePosition(isLiquidated = false) {
      if (!position) return;
      
      if (isLiquidated) {
        position = null;
        persistData(KEY_POSITION, '');
        persistData(KEY_BALANCE, balance);
        applyUI();
        return;
      }

      const livePrice = prices[position.asset];
      let diff = (livePrice - position.entryPrice) / position.entryPrice;
      if (position.type === 'SHORT') diff = -diff;

      const pnlUSD = position.size * diff;
      balance += Math.max(0, (position.size + pnlUSD));
      
      position = null;
      persistData(KEY_POSITION, '');
      persistData(KEY_BALANCE, balance);

      applyUI();
    }

    function checkLiquidationStatus() {
      if (balance < 10 && !position) {
        document.getElementById('liquidation-modal').classList.remove('hidden');
      }
    }

    function resetBalance() {
      balance = 10000;
      position = null;
      persistData(KEY_BALANCE, balance);
      persistData(KEY_POSITION, '');
      document.getElementById('liquidation-modal').classList.add('hidden');
      applyUI();
    }

    initData();
    startBinanceFeed();
  </script>
</body>
</html>
