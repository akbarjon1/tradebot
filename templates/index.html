<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade AI Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b1120;
            color: #e2e8f0;
            margin: 0;
            padding: 16px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 22px; color: #38bdf8; font-weight: 700; }
        .live-badge {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .card {
            background-color: #131d33;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #1e293b;
        }
        .card h3 { margin: 0 0 6px 0; font-size: 13px; color: #94a3b8; }
        .card .value { font-size: 22px; font-weight: bold; color: #f8fafc; }

        /* Qidiruv va Filtr qismi */
        .controls {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .search-box {
            width: 100%;
            padding: 12px 16px;
            background: #131d33;
            border: 1px solid #1e293b;
            border-radius: 10px;
            color: #f8fafc;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        .search-box:focus {
            border-color: #38bdf8;
        }
        .filter-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn-filter {
            background: #131d33;
            color: #94a3b8;
            border: 1px solid #1e293b;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-filter:hover, .btn-filter.active {
            background: #38bdf8;
            color: #0b1120;
            border-color: #38bdf8;
            font-weight: 600;
        }

        .section-title {
            font-size: 18px;
            margin-bottom: 15px;
            color: #f1f5f9;
        }
        .trade-card {
            background-color: #131d33;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 16px;
            border: 1px solid #1e293b;
            border-left: 4px solid #38bdf8;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: 0.2s;
        }
        .trade-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        .trade-title {
            font-size: 17px;
            font-weight: 600;
            color: #f8fafc;
        }
        .trade-date {
            font-size: 12px;
            color: #64748b;
            background: #0f172a;
            padding: 3px 8px;
            border-radius: 6px;
        }
        .trade-content {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            font-size: 13.5px;
            color: #cbd5e1;
            line-height: 1.6;
            white-space: pre-wrap;
            border: 1px solid #1e293b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Trade AI Dashboard</h1>
            <div class="live-badge">● Jonli</div>
        </div>

        <div class="stats-grid">
            <div class="card">
                <h3>Jami Tahlillar</h3>
                <div class="value" id="visible-count">{{ trades|length }} ta</div>
            </div>
            <div class="card">
                <h3>Holat</h3>
                <div class="value" style="color: #38bdf8;">Sinxron</div>
            </div>
        </div>

        <!-- Filtr va Qidiruv boshqaruvi -->
        <div class="controls">
            <input type="text" id="searchInput" class="search-box" placeholder="Savdo nomi yoki juftlik bo'yicha qidirish (masalan: EURUSD)...">
            <div class="filter-buttons">
                <button class="btn-filter active" onclick="applyFilter('all', this)">Barchasi</button>
                <button class="btn-filter" onclick="applyFilter('Profit', this)">Profit</button>
                <button class="btn-filter" onclick="applyFilter('EURUSD', this)">EURUSD</button>
                <button class="btn-filter" onclick="applyFilter('Short', this)">Short</button>
                <button class="btn-filter" onclick="applyFilter('Long', this)">Long</button>
            </div>
        </div>

        <div class="section-title">Savdo Tarixi</div>
        
        <div id="tradesList">
            {% for trade in trades %}
            <div class="trade-card" data-search="{{ trade.title | lower }} {{ trade.content | lower }}">
                <div class="trade-header">
                    <span class="trade-title">{{ trade.title }}</span>
                    {% if trade.date %}
                    <span class="trade-date">{{ trade.date }}</span>
                    {% endif %}
                </div>
                <div class="trade-content">{{ trade.content }}</div>
            </div>
            {% else %}
            <p id="noTrades" style="color: #64748b; text-align: center; padding: 30px;">Hozircha saqlangan tahlillar yo'q.</p>
            {% endfor %}
        </div>
    </div>

    <script>
        let currentFilter = 'all';

        function filterTrades() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.trade-card');
            let count = 0;

            cards.forEach(card => {
                const searchData = card.getAttribute('data-search');
                const matchesSearch = searchData.includes(query);
                const matchesFilter = currentFilter === 'all' || searchData.includes(currentFilter.toLowerCase());

                if (matchesSearch && matchesFilter) {
                    card.style.display = 'block';
                    count++;
                } else {
                    card.style.display = 'none';
                }
            });

            document.getElementById('visible-count').innerText = count + ' ta';
        }

        document.getElementById('searchInput').addEventListener('input', filterTrades);

        function applyFilter(filterVal, btn) {
            currentFilter = filterVal;
            document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterTrades();
        }
    </script>
</body>
</html>
