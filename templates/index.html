<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OBSIDIAN LAB — Build. Trade. Compete.</title>
<link rel="icon" type="image/svg+xml" href="/static/bat.svg?v=3">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
 --bg:#e7e3da;--card:#f1eee7;--ink:#151515;--muted:#77756e;--line:#d1cdc3;
 --accent:#b8ff3d;--green:#477743;--red:#c95757;--dark:#171717;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit}
a{text-decoration:none;color:inherit}
button,a{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:3px}
header{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 32px;gap:32px;position:sticky;top:0;z-index:50;background:rgba(231,227,218,.96);backdrop-filter:blur(12px)}
.logo{display:flex;align-items:center;gap:11px;font-size:12px;font-weight:800;letter-spacing:1.8px;white-space:nowrap}
/* Logo va ko'rshapalak ikonkasini mukammal moslash */
.logoMark{
  width: 32px;
  height: 32px;
  flex: 0 0 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-radius: 8px;
  background: transparent !important;
  line-height: 0;
}
.logoMark img{
  display: block;
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}
.authBrandMark{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  line-height: 0;
}
.authBrandMark img{
  display: block;
  width: 20px;
  height: 20px;
  object-fit: contain;
}
.logoMark{width:31px;height:31px;border-radius:7px;background:var(--dark);color:#fff;display:grid;place-items:center;font-size:18px}
nav{display:flex;gap:29px;margin:auto}
nav a{font-size:12px;padding:26px 0;position:relative;color:#333}
nav a:hover{opacity:.55}
nav a.active{font-weight:700}
nav a.active:after{content:"";position:absolute;bottom:13px;left:0;right:0;height:2px;background:var(--ink)}
.headRight{display:flex;align-items:center;gap:12px}
.iconBtn{border:0;background:transparent;padding:8px}
 .avatar{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--dark);color:#fff;border:1px solid rgba(0,0,0,.12);font-weight:700;cursor:pointer;transition:transform .16s,background .16s}
 .avatar:hover{transform:translateY(-1px);background:#292929}
 .profileWrap{position:relative;display:flex;align-items:center}
 .avatar svg{width:21px;height:21px;display:block}
 .profileMenu{position:absolute;right:0;top:calc(100% + 11px);width:218px;background:#f8f7f2;border:1px solid #d8d6ce;border-radius:13px;padding:8px;box-shadow:0 14px 38px rgba(0,0,0,.16);z-index:1000;display:none}
 .profileMenu.open{display:block;animation:profilePop .14s ease-out}
 @keyframes profilePop{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
 .profileIdentity{padding:10px 11px 12px;border-bottom:1px solid #e1dfd7;margin-bottom:6px;overflow:hidden}
 .profileIdentity strong{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .profileIdentity small{display:block;color:#77766f;font-size:10px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .profileItem{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:8px;font:inherit;font-size:12px;color:#222;cursor:pointer}
 .profileItem:hover{background:#eae8df}
 .profileItem.danger{color:#b63838}
 .profileItem .menuGlyph{width:17px;text-align:center;font-size:15px;color:#666}
 @media(max-width:600px){.profileMenu{right:-4px;width:205px}.avatar{width:34px;height:34px;border-radius:10px}}

.menu{display:none}
main{max-width:1450px;margin:auto;padding:42px 4.5% 65px;min-height:calc(100vh - 130px)}
.hero{min-height:485px;display:flex;align-items:center;position:relative;overflow:hidden}
.heroText{max-width:650px;z-index:3}
.eyebrow{font-size:10px;letter-spacing:2px;font-weight:700}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:8px;box-shadow:0 0 0 3px rgba(184,255,61,.12)}
.hero h1{font-size:clamp(46px,6vw,78px);line-height:1.02;letter-spacing:-4px;margin:22px 0}
.hero p{max-width:450px;line-height:1.85;color:var(--muted);font-size:14px}
.heroArt{position:absolute;right:-3%;bottom:-80px;width:54%;height:600px;opacity:.98;background:
linear-gradient(140deg,transparent 0 28%,#343632 28% 31%,transparent 31% 34%,#1a1b19 34% 39%,transparent 39%),
linear-gradient(35deg,#121311 0 20%,#383a35 20% 33%,#171916 33% 48%,#51534d 48% 52%,#10110f 52% 72%,#2c2e2a 72% 100%);
clip-path:polygon(13% 100%,25% 67%,35% 60%,40% 40%,50% 32%,55% 16%,63% 7%,70% 13%,74% 32%,83% 41%,86% 68%,94% 78%,100% 100%);
}
.caption{position:absolute;right:12%;top:48%;z-index:4;color:#eee;letter-spacing:2px;font-size:10px;border-left:2px solid var(--accent);padding-left:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:6px;padding:12px 19px;font-size:11px;font-weight:700;transition:.18s}
.btn:hover{transform:translateY(-1px);opacity:.87}
.btn.light{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.green{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px;box-shadow:0 5px 18px rgba(0,0,0,.025)}
.navCard{min-height:145px;transition:.2s}
.navCard:hover{transform:translateY(-5px);box-shadow:0 12px 28px rgba(0,0,0,.07)}
.navCard .bigIcon{font-size:25px;margin-bottom:18px}
.navCard h3{margin:0 0 8px;font-size:14px}
.muted{color:var(--muted)}
.small{font-size:10px}
.status{display:flex;gap:80px;padding:30px 0}
.status strong{display:block;font-size:11px}
.status small{color:var(--muted);font-size:9px;letter-spacing:1px}
.pageHead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}
.pageHead h1{margin:0 0 6px;font-size:38px;letter-spacing:-2px}
.pageHead p{margin:0;color:var(--muted)}
.search{max-width:330px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:11px 12px}
label{font-size:10px;color:var(--muted);display:block;margin:13px 0 5px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:15px 17px;border-bottom:1px solid var(--line);font-size:11px}
th{color:var(--muted);font-weight:500;font-size:10px}
tr:last-child td{border-bottom:0}
.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.coin{width:30px;height:30px;border-radius:50%;background:var(--dark);color:var(--accent);display:inline-grid;place-items:center;font-weight:700;margin-right:9px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.pos{color:var(--green)}.neg{color:var(--red)}
.badge{font-size:9px;border:1px solid var(--line);padding:4px 7px;border-radius:4px}
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin:16px 0}
.tab{border:0;background:#d2cec455;padding:8px 13px;border-radius:5px;font-size:10px}
.tab.active{background:var(--dark);color:#fff}
.workspace{display:grid;grid-template-columns:185px 1fr;gap:30px}
.sidebar{border-right:1px solid var(--line);padding-right:20px}
.sidebar h4{font-size:10px;letter-spacing:1.8px;margin:8px 0 15px}
.sidebar a{display:flex;gap:11px;padding:11px 12px;border-radius:5px;font-size:11px;margin-bottom:4px}
.sidebar a.active{background:#d3d0c7;font-weight:700}
.stats .card{padding:20px}.statVal{font-size:27px;font-weight:700;letter-spacing:-1px}.statLabel{font-size:10px;color:var(--muted)}
.officeGrid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:18px}
.activity{padding:12px 0;border-bottom:1px solid var(--line)}
.activity:last-child{border:0}
.activity strong{font-size:12px}
.activity small{display:block;color:var(--muted);margin-top:2px}
.chart{height:400px;position:relative;overflow:hidden;border-radius:8px}
.chart iframe{width:100%;height:100%;border:0}

/* Register / Login visual panel */
.authArt{
  position:relative;
  overflow:hidden;
  min-height:520px;
  background:#151515;
  color:#fff;
  padding:42px;
  border-radius:10px 0 0 10px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.authArt::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:linear-gradient(to bottom,transparent 0%,#000 18%,#000 82%,transparent 100%);
  pointer-events:none;
}
.authArt::after{
  content:"";
  position:absolute;
  width:360px;
  height:360px;
  right:-120px;
  top:115px;
  border:1px solid rgba(255,255,255,.10);
  border-radius:50%;
  box-shadow:0 0 0 38px rgba(255,255,255,.025),0 0 0 76px rgba(255,255,255,.018);
  pointer-events:none;
}
.authBrand,.authVisual,.authCopy{position:relative;z-index:2}
.authBrand{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:12px;
  font-weight:800;
  letter-spacing:1.6px;
}
.authBrandMark{
  width:20px;height:20px;border:1px solid rgba(255,255,255,.8);
  border-radius:5px;display:grid;place-items:center;font-size:10px;
}
.authVisual{margin-top:8px}
.authTerminal{
  border:1px solid rgba(255,255,255,.14);
  border-radius:10px;
  background:rgba(255,255,255,.035);
  padding:18px;
  width:min(100%,390px);
  backdrop-filter:blur(4px);
}
.authTerminalTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.authTerminalTitle{font-size:10px;letter-spacing:1.4px;color:rgba(255,255,255,.62)}
.authLive{font-size:9px;letter-spacing:1px;color:#fff;display:flex;align-items:center;gap:6px}
.authLive i{width:6px;height:6px;border-radius:50%;background:#fff;display:block;box-shadow:0 0 10px rgba(255,255,255,.8)}
.authChart{height:145px;position:relative;overflow:hidden}
.authChart svg{width:100%;height:100%;display:block}
.authChartLine{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:600;stroke-dashoffset:600;animation:authDraw 4s ease-in-out infinite alternate}
.authChartGlow{fill:none;stroke:rgba(255,255,255,.14);stroke-width:8;filter:blur(5px)}
.authChartGrid{stroke:rgba(255,255,255,.08);stroke-width:1}
@keyframes authDraw{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
.authStats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.authStat{border-top:1px solid rgba(255,255,255,.12);padding-top:9px}
.authStat b{display:block;font-size:11px;letter-spacing:.7px}
.authStat span{display:block;margin-top:3px;font-size:8px;letter-spacing:1.1px;color:rgba(255,255,255,.42)}
.authCopy h2{font-size:24px;letter-spacing:-1px;margin:0 0 9px}
.authCopy p{margin:0;color:rgba(255,255,255,.55);font-size:12px;line-height:1.65}

.auth{max-width:980px;margin:30px auto;display:grid;grid-template-columns:1fr 1fr}
.authArt{background:var(--dark);color:#fff;padding:42px;border-radius:10px 0 0 10px;display:flex;flex-direction:column;justify-content:space-between}
.authForm{background:var(--card);padding:42px;border-radius:0 10px 10px 0}
.authForm h1{font-size:31px;margin:0 0 7px}
.modalBack{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:100;padding:20px}
.modalBack.show{display:grid}
.modal{background:var(--card);width:min(600px,100%);max-height:90vh;overflow:auto;border-radius:11px;border:1px solid var(--line);padding:25px}
.toast{position:fixed;right:20px;bottom:20px;background:var(--dark);color:#fff;padding:14px 20px;border-radius:7px;display:none;z-index:200}
.toast.show{display:block}
footer{border-top:1px solid var(--line);padding:20px 4.5%;display:flex;justify-content:space-between;color:var(--muted);font-size:9px;letter-spacing:1px}
.empty{text-align:center;padding:50px;color:var(--muted)}

@media(max-width:700px){
  .authArt{min-height:430px;padding:24px}
  .authTerminal{width:100%;padding:14px}
  .authChart{height:125px}
  .authStats{gap:7px}
  .authStat b{font-size:10px}
  .authStat span{font-size:7px}
  .authCopy h2{font-size:20px}
}

@media(max-width:1050px){nav{gap:17px}.g4{grid-template-columns:repeat(2,1fr)}.officeGrid{grid-template-columns:1fr 1fr}.terminal{grid-template-columns:1fr!important}.heroArt{opacity:.35;width:70%}}
@media(max-width:720px){
 header{height:64px;padding:0 17px;gap:10px}.menu{display:block}.headRight{margin-left:auto}nav{display:none;position:absolute;top:64px;left:0;right:0;background:var(--bg);padding:15px 20px;border-bottom:1px solid var(--line);flex-direction:column;gap:4px}nav.open{display:flex}nav a{padding:10px}nav a.active:after{display:none}
 main{padding:25px 17px 45px}.hero{min-height:510px;align-items:flex-start}.hero h1{font-size:43px;letter-spacing:-2px}.heroArt{bottom:-10px;width:90%;height:340px}.caption{display:none}.g4,.g3,.g2,.officeGrid,.auth{grid-template-columns:1fr}.status{gap:22px;flex-wrap:wrap}.pageHead{align-items:flex-start;flex-direction:column}.workspace{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line);padding:0 0 8px;display:flex;overflow:auto}.sidebar h4{display:none}.sidebar a{white-space:nowrap}.auth{margin:0}.authArt{min-height:170px;border-radius:10px 10px 0 0;padding:25px}.authForm{border-radius:0 0 10px 10px;padding:26px}footer{gap:12px;flex-direction:column}
}

/* =========================================================
   OBSIDIAN LAB — MOBILE / TABLET RESPONSIVE
   Desktop layout stays unchanged; mobile gets its own clean
   compact layout so nothing is squeezed or tilted.
   ========================================================= */
@media (max-width: 900px){
  header{
    height:64px;
    padding:0 18px;
    gap:14px;
  }
  .menu{display:block}
  header nav{
    display:none;
    position:absolute;
    top:64px;
    left:0;
    right:0;
    margin:0;
    padding:10px 14px;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    flex-direction:column;
    gap:2px;
    overflow:visible;
  }
  header nav.open{display:flex}
  header nav a{padding:11px 8px}
  header nav a.active:after{display:none}
  .logo{font-size:11px;letter-spacing:1.4px}
  .logoMark{width:29px;height:29px}
  nav{
    gap:18px;
    overflow-x:auto;
    scrollbar-width:none;
    margin-left:auto;
    margin-right:0;
  }
  nav::-webkit-scrollbar{display:none}
  nav a{
    font-size:11px;
    white-space:nowrap;
    padding:23px 0;
  }
  .headRight{gap:5px}
  main{
    width:100%;
    max-width:none;
    padding:28px 18px 50px;
    overflow:hidden;
  }
  .hero{
    min-height:430px;
  }
  .heroArt{
    right:-18%;
    width:82%;
    opacity:.48;
  }
  .heroText{max-width:100%}
  .hero h1{
    font-size:clamp(42px,10vw,64px);
    letter-spacing:-3px;
  }
  .grid.g4,
  .grid.g3,
  .grid.g2{
    grid-template-columns:1fr 1fr !important;
  }
  .tableWrap{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
}

@media (max-width: 600px){
  .grid[style*="grid-template-columns:180px"],
  .grid[style*="minmax(150px,180px)"]{
    grid-template-columns:1fr !important;
  }
  .chart{height:320px !important}
  #active-pos-box .grid.g4{grid-template-columns:1fr 1fr !important}
  #active-pos-box .card{padding:13px}
  #active-pos-box .row.between{flex-wrap:wrap}
  #active-pos-box .row.between h3{max-width:100%}
  html,body{
    width:100%;
    max-width:100%;
    overflow-x:hidden;
  }
  body{
    font-size:13px;
  }
  header{
    position:sticky;
    top:0;
    height:58px;
    padding:0 12px;
    gap:9px;
  }
  .logo{
    flex:0 0 auto;
    gap:7px;
    font-size:9px;
    letter-spacing:1px;
  }
  .logoMark{
    width:27px;
    height:27px;
    border-radius:6px;
    font-size:15px;
  }
  nav{
    flex:1 1 auto;
    min-width:0;
    gap:15px;
  }
  nav a{
    font-size:10px;
    padding:20px 0;
  }
  .headRight{
    flex:0 0 auto;
  }
  .headRight .iconBtn{
    padding:5px;
  }
  .avatar{
    width:30px;
    height:30px;
    font-size:11px;
  }

  main{
    padding:22px 13px 38px;
    min-height:calc(100vh - 100px);
  }

  .hero{
    min-height:560px;
    display:block;
    padding-top:42px;
  }
  .heroText{
    position:relative;
    z-index:5;
    max-width:100%;
  }
  .eyebrow{
    font-size:9px;
    letter-spacing:1.6px;
  }
  .hero h1{
    font-size:clamp(42px,14vw,62px);
    line-height:.98;
    letter-spacing:-3px;
    margin:18px 0;
  }
  .hero p{
    max-width:330px;
    font-size:13px;
    line-height:1.7;
  }
  .heroArt{
    right:-27%;
    bottom:-25px;
    width:105%;
    height:420px;
    opacity:.28;
  }
  .caption{
    right:7%;
    top:auto;
    bottom:75px;
    font-size:8px;
  }

  /* Cards and grids become one clean column. */
  .grid.g4,
  .grid.g3,
  .grid.g2,
  .g4,.g3,.g2{
    grid-template-columns:1fr !important;
  }
  .card{
    width:100%;
    min-width:0;
    padding:16px;
    border-radius:8px;
  }
  .card h2{
    font-size:16px;
  }

  /* Trade page: chart first, controls below; no squeezed desktop columns. */
  .tradeLayout,
  .tradeGrid,
  .marketLayout,
  .officeLayout,
  .contentGrid{
    display:flex !important;
    flex-direction:column !important;
    width:100% !important;
    min-width:0 !important;
  }
  .tradeLayout > *,
  .tradeGrid > *,
  .marketLayout > *,
  .officeLayout > *,
  .contentGrid > *{
    width:100% !important;
    min-width:0 !important;
    max-width:100% !important;
  }

  /* Forms */
  form{
    width:100%;
    min-width:0;
  }
  input,select,textarea{
    width:100%;
    max-width:100%;
    min-height:42px;
  }
  .row{
    min-width:0;
    flex-wrap:wrap;
  }
  .row.between{
    gap:10px;
  }
  .row > *{
    min-width:0;
  }
  .btn{
    min-height:42px;
    padding:11px 14px;
  }

  /* Position action buttons stack instead of overflowing. */
  #active-pos-box .row.between{
    align-items:flex-start;
  }
  #active-pos-box .row.between > .row{
    width:100%;
  }
  #active-pos-box .row.between > .row .btn{
    flex:1 1 140px;
  }

  /* Tables are intentionally scrollable, never squeezed. */
  .tableWrap{
    width:100%;
    max-width:100%;
    overflow-x:auto;
    border-radius:8px;
  }
  table{
    min-width:620px;
  }

  /* Charts/iframes/media */
  iframe,canvas,video{
    max-width:100%;
  }
  .chart,
  .chartBox{
    width:100% !important;
    min-width:0 !important;
    overflow:hidden;
  }

  /* Modals fit inside phone viewport. */
  .modalBack{
    padding:12px;
  }
  .modal{
    width:min(100%,520px) !important;
    max-width:100% !important;
    max-height:90vh;
    overflow:auto;
    margin:0;
    border-radius:10px;
  }

  footer{
    padding:18px 13px !important;
    gap:8px;
    flex-wrap:wrap;
  }
}

@media (max-width: 380px){
  header{
    padding:0 9px;
  }
  nav{
    gap:11px;
  }
  nav a{
    font-size:9px;
  }
  main{
    padding-left:10px;
    padding-right:10px;
  }
  .hero{
    min-height:530px;
  }

<script>
let csrfToken = '';
const localUser = JSON.parse(localStorage.getItem('obsidian_user') || 'null');
const state = {
  user: localUser,
  balance: Number(localStorage.getItem('obsidian_balance') || 10000.0),
  trades: JSON.parse(localStorage.getItem('obsidian_trades') || '[]'),
  position: JSON.parse(localStorage.getItem('obsidian_pos') || 'null'),
  positions: JSON.parse(localStorage.getItem('obsidian_positions') || '[]')
};
let paperSynced = false;
let oldLocalPosition = state.position;
let closingPosition = false;
let openingPosition = false;
let lastPaperSignature = '';

async function syncPaperState() {
  try {
    // Sessionni serverdan qayta tekshiramiz: PC va telefon har birida
    // alohida browser session bo'ladi, lekin account bir xil bo'lishi kerak.
    const sessionData = await fetchAPI('/api/session?t=' + Date.now());
    if (sessionData && sessionData.csrf) csrfToken = sessionData.csrf;
    if (sessionData && sessionData.user) {
      state.user = sessionData.user;
      localStorage.setItem('obsidian_user', JSON.stringify(state.user));
    } else {
      return;
    }

    const data = await fetchAPI('/api/paper/state?t=' + Date.now());
    if (data.status !== 'success') return;

    const serverHasPosition = Array.isArray(data.positions) ? data.positions.length > 0 : !!data.position;

    // Eski versiyadagi local position bo'lsa, uni serverga bir marta ko'chiramiz.
    if (!serverHasPosition && oldLocalPosition) {
      const migrated = await fetchAPI('/api/paper/migrate', {
        method: 'POST',
        body: JSON.stringify({ position: oldLocalPosition })
      });
      if (migrated.status === 'success') {
        oldLocalPosition = null;
        const again = await fetchAPI('/api/paper/state?t=' + Date.now());
        if (again.status === 'success') {
          state.balance = Number(again.balance || 10000);
          state.positions = again.positions || (again.position ? [again.position] : []);
          state.position = state.positions[0] || null;
          state.trades = again.trades || [];
        }
      }
    } else {
      state.balance = Number(data.balance || 10000);
      state.positions = data.positions || (data.position ? [data.position] : []);
      state.position = state.positions[0] || null;
      state.trades = data.trades || [];
    }

    localStorage.setItem('obsidian_balance', state.balance);
    localStorage.setItem('obsidian_trades', JSON.stringify(state.trades));
    if (state.position) localStorage.setItem('obsidian_pos', JSON.stringify(state.position));
    else localStorage.removeItem('obsidian_pos');
    localStorage.setItem('obsidian_positions', JSON.stringify(state.positions || []));

    // IMPORTANT: syncing from the second device must NOT rebuild the whole page
    // every 3 seconds. Re-rendering the trade page recreated the TradingView iframe
    // and looked like a browser refresh. Only rebuild when server-side positions
    // or trade history actually changed; balance alone is updated in-place.
    const paperSignature = JSON.stringify({
      positions: (state.positions || []).map(p => [p.id,p.pair,p.type,p.size,p.leverage,p.entryPrice,p.tp,p.sl]),
      trades: (state.trades || []).map(t => [t.id,t.status,t.exit_price,t.pnl,t.created_at])
    });
    const positionsChanged = paperSignature !== lastPaperSignature;
    lastPaperSignature = paperSignature;

    paperSynced = true;
    const avail = document.getElementById('avail-balance');
    if (avail) avail.textContent = money(state.balance);

    if (positionsChanged && (location.hash.includes('/trade') || location.hash.includes('/markets/'))) {
      const sym = (location.hash.split('/')[2] || 'BTC').toUpperCase();
      renderTrade(sym === 'TRADE' ? 'BTC' : sym);
    }
  } catch(e) {
    console.warn('Paper state sync error:', e);
  }
}



async function fetchAPI(url, options = {}) {
  options.headers = options.headers || {};
  options.headers['Content-Type'] = 'application/json';
  if (csrfToken) options.headers['X-CSRF-Token'] = csrfToken;
  options.credentials = 'include';
  try {
    const res = await fetch(url, options);
    return await res.json();
  } catch(e) {
    return { status: 'error', message: e.message };
  }
}

function checkSessionBg() {
  fetchAPI('/api/session').then(data => {
    if (data && data.csrf) csrfToken = data.csrf;
    if (data && data.user) {
      state.user = data.user;
      // Paper balance server state is the source of truth; /api/paper/state will refresh it.
      state.balance = Number(state.balance || data.user.balance || 10000.0);
      localStorage.setItem('obsidian_user', JSON.stringify(state.user));
      localStorage.setItem('obsidian_balance', state.balance);
      updateAvatar();
    }
  }).catch(()=>{});
}

function save() {
  localStorage.setItem('obsidian_user', JSON.stringify(state.user));
  localStorage.setItem('obsidian_trades', JSON.stringify(state.trades));
  localStorage.setItem('obsidian_balance', state.balance);
  localStorage.setItem('obsidian_pos', JSON.stringify(state.position));
  localStorage.setItem('obsidian_positions', JSON.stringify(state.positions || []));
}

async function syncBalance(newBal) {
  state.balance = newBal;
  save();
  if (state.user) {
    fetchAPI('/api/update_balance', {
      method: 'POST',
      body: JSON.stringify({ user_id: state.user.id, username: state.user.username, balance: Number(state.balance.toFixed(2)) })
    }).catch(()=>{});
  }
}

function toast(t, duration = 2600) {
  const x = document.getElementById('toast');
  if (!x) return;
  x.textContent = t;
  x.classList.add('show');
  clearTimeout(window.tt);
  window.tt = setTimeout(() => x.classList.remove('show'), duration);
}

function hideToast() {
  const x = document.getElementById('toast');
  if (!x) return;
  clearTimeout(window.tt);
  x.classList.remove('show');
}

function go(p) {
  location.hash = '#' + p;
  closeModal();
  route();
}

function route() {
  let raw = location.hash.slice(1) || '/';
  if (!raw.startsWith('/')) raw = '/' + raw;
  const p = raw.split('?')[0] || '/';
  
  document.querySelectorAll('[data-route]').forEach(a => {
    a.classList.toggle('active', a.dataset.route === p || (a.dataset.route !== '/' && p.startsWith(a.dataset.route)));
  });
  const nav = document.getElementById('nav');
  if (nav) nav.classList.remove('open');
  render(p);
}

function render(p) {

      btnShort.classList.remove('active');
      const b = document.getElementById('exec-btn');
      b.className = 'btn green'; b.textContent = 'OPEN LONG';
    };
  }
  if (btnShort) {
    btnShort.onclick = () => {
      side = 'SHORT';
      btnShort.classList.add('active');
      btnLong.classList.remove('active');
      const b = document.getElementById('exec-btn');
      b.className = 'btn red'; b.textContent = 'OPEN SHORT';
    };
  }

  document.querySelectorAll('[data-lev]').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('[data-lev]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      leverage = Number(btn.dataset.lev);
      const levDisplay = document.getElementById('lev-display');
      if (levDisplay) levDisplay.textContent = leverage + 'x';
    };
  });

  window.setPercent = (p) => {
    const el = document.getElementById('trade-amount');
    if (el) el.value = Math.max(10, Math.floor(state.balance * p));
  };

  const tradeForm = document.getElementById('tradeForm');
  if (tradeForm) {
    tradeForm.onsubmit = async (e) => {
      e.preventDefault();
      const amount = Number(document.getElementById('trade-amount').value);
      if (amount < 10) return toast('Minimal savdo $10!');
      if (amount > state.balance) return toast('Balans yetarli emas!');

      if (!state.user) return go('/login');
      if (!paperSynced) return toast('Account sync qilinmoqda…', 1200);
      if (openingPosition) return;
      openingPosition = true;

      const tpVal = parseFloat(document.getElementById('trade-tp').value) || null;
      const slVal = parseFloat(document.getElementById('trade-sl').value) || null;
      const pNow = livePrices[pair] || a[2];

      const res = await fetchAPI('/api/paper/open', {
        method: 'POST',
        body: JSON.stringify({
          pair: pair,
          side: side,
          amount: amount,
          leverage: leverage,
          entryPrice: pNow,
          tp: tpVal,
          sl: slVal
        })
      });

      if (res.status !== 'success') { openingPosition = false; return toast(res.message || 'Trade ochilmadi'); }

      state.balance = Number(res.balance);
      state.positions = [res.position, ...(state.positions || [])];
      state.position = state.positions[0];
      localStorage.setItem('obsidian_balance', state.balance);
      localStorage.setItem('obsidian_pos', JSON.stringify(state.position));
      localStorage.setItem('obsidian_positions', JSON.stringify(state.positions));
      openingPosition = false;
      toast(side + ' bitim ochildi!');
      renderTrade(sym);
    };
  }
}

window.toggleFreezePosition = async function() {
  if (!state.position) return;

  const frozen = !Boolean(state.position.frozen);
  const livePrice = livePrices[state.position.pair] || state.position.entryPrice;

  const res = await fetchAPI('/api/paper/freeze', {
    method: 'POST',
    body: JSON.stringify({ frozen, livePrice })
  });

  if (res.status !== 'success') {
    return toast(res.message || 'Freeze ishlamadi');
  }

  state.position = res.position;
  localStorage.setItem('obsidian_pos', JSON.stringify(state.position));
  toast(frozen ? 'Position FROZEN ❄' : 'Position UNFROZEN ▶');
  render(location.hash.slice(1) || '/trade');
};

window.closePosition = async function(positionId, reason = null) {
  if (closingPosition) return;
  const positions = state.positions || [];
  const p = positions.find(x => String(x.id) === String(positionId));
  if (!p) return;

  closingPosition = true;
  const live = livePrices[p.pair] || p.entryPrice;
  const res = await fetchAPI('/api/paper/close', {
    method: 'POST',
    body: JSON.stringify({ id: p.id, livePrice: live })
  });

  if (res.status !== 'success') {
    closingPosition = false;
    return toast(res.message || 'Position yopilmadi');
  }

  state.balance = Number(res.balance);
  state.positions = positions.filter(x => String(x.id) !== String(p.id));
  state.position = state.positions[0] || null;
  localStorage.setItem('obsidian_balance', state.balance);
  localStorage.setItem('obsidian_positions', JSON.stringify(state.positions));
  if (state.position) localStorage.setItem('obsidian_pos', JSON.stringify(state.position));
  else localStorage.removeItem('obsidian_pos');

  closingPosition = false;
  toast(reason || 'Bitim yopildi!');
  renderTrade((location.hash.split('/')[2] || 'BTC').toUpperCase());
};

window.calcPositionSize = function() {
  const bal = parseFloat(document.getElementById('calc-balance').value) || 0;
  const riskPct = parseFloat(document.getElementById('calc-risk-pct').value) || 0;
  const slPct = parseFloat(document.getElementById('calc-sl-pct').value) || 0;

  if (bal <= 0 || riskPct <= 0 || slPct <= 0) return toast('Barcha maydonlarni to‘ldiring!');

  const riskUSD = bal * (riskPct / 100);
  const posSize = riskUSD / (slPct / 100);
  const resBox = document.getElementById('calc-result');
  if (resBox) {
    resBox.style.display = 'block';
    resBox.innerHTML = `
      <strong>Maksimal yo‘qotish:</strong> <span class="neg">$${riskUSD.toFixed(2)}</span><br>
      <strong>Tavsiya etilgan ochiladigan hajm:</strong> <span class="pos">$${posSize.toFixed(2)}</span><br>
      <small class="muted">Agar narx Stop-Loss masofasiga (${slPct}%) yetsa, siz aynan $${riskUSD.toFixed(2)} yo'qotasiz.</small>
    `;
  }
};

function toggleProfileMenu(event) {
  if (event) event.stopPropagation();

  const button = document.getElementById('avatar');

  const opened = menu.classList.toggle('open');

}
function closeProfileMenu() {
  const menu = document.getElementById('profileMenu');

function updateAvatar() {

    if (name) name.textContent = 'Guest';
    if (email) email.textContent = 'Sign in to your account';

  }
}

async function updateBinancePrices() {
  try {
    const [resBtc, resEth] = await Promise.all([
      fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT'),
      fetch('https://api.binance.com/api/v3/ticker/price?symbol=ETHUSDT')
    ]);
    const dBtc = await resBtc.json();
    const dEth = await resEth.json();
    if (dBtc.price) livePrices.BTCUSDT = parseFloat(dBtc.price);
    if (dEth.price) livePrices.ETHUSDT = parseFloat(dEth.price);
  } catch (e) {
    livePrices.BTCUSDT += (Math.random() - 0.49) * 10;
  }

  const pBtc = document.getElementById('m-price-BTC');
  if (pBtc) pBtc.textContent = money(livePrices.BTCUSDT);
  const pEth = document.getElementById('m-price-ETH');
  if (pEth) pEth.textContent = money(livePrices.ETHUSDT);

  const termP = document.getElementById('terminal-price');
  if (termP) {
    const pair = location.hash.includes('ETH') ? 'ETHUSDT' : 'BTCUSDT';
    termP.textContent = money(livePrices[pair]);
  }

  (state.positions || []).forEach(pos => {
    const cur = livePrices[pos.pair] || pos.entryPrice;
    let diff = (cur - pos.entryPrice) / pos.entryPrice;
    if (pos.type === 'SHORT') diff = -diff;
    const pnl = pos.size * diff * pos.leverage;

    const pnlEl = document.getElementById('pos-pnl-' + pos.id);
    if (pnlEl) {
      pnlEl.className = pnl >= 0 ? 'pos' : 'neg';
      pnlEl.innerHTML = `<strong>${pnl >= 0 ? '+' : ''}${money(pnl)} (${((pnl/pos.size)*100).toFixed(2)}%)</strong>`;
    }

    if (pos.type === 'LONG') {
      if (pos.tp && cur >= pos.tp) closePosition(pos.id, `🎯 Take-Profit! Narx: $${cur}`);
      else if (pos.sl && cur <= pos.sl) closePosition(pos.id, `🛑 Stop-Loss! Narx: $${cur}`);
    } else {
      if (pos.tp && cur <= pos.tp) closePosition(pos.id, `🎯 Take-Profit! Narx: $${cur}`);
      else if (pos.sl && cur >= pos.sl) closePosition(pos.id, `🛑 Stop-Loss! Narx: $${cur}`);
    }
  });
}

<script>

      'Page not found':'Sahifa topilmadi','BACK HOME':'BOSH SAHIFAGA','Profile':'Profil','Settings':'Sozlamalar','Updates from your trading terminal':'Savdo terminalingizdan yangiliklar','Paper trades':'Demo bitimlar','Balance':'Balans','Loading…':'Yuklanmoqda…','Close':'Yopish','CLOSE':'YOPISH','Buy':'Sotib olish','Sell':'Sotish','Amount':'Miqdor','Leverage':'Kredit yelkasi','Open position':'Pozitsiya ochish','No positions open':'Ochiq pozitsiyalar yo‘q'
    },
    ru:{
      'Home':'Главная','Markets':'Рынки','Trade':'Торговля','Leaderboard':'Рейтинг','Web Office':'Веб-офис','Notifications':'Уведомления',
      'SYSTEM ONLINE':'СИСТЕМА РАБОТАЕТ','Build. Trade. Compete.':'Создавай. Торгуй. Соревнуйся.','A modern platform for traders, builders and ambitious minds. Explore markets, practice trading and build your next opportunity.':'Современная платформа для трейдеров и создателей. Изучайте рынки, практикуйтесь в торговле и создавайте новые возможности.',
      'GET STARTED →':'НАЧАТЬ →','EXPLORE MARKETS':'ОБЗОР РЫНКОВ','Explore market data':'Изучить данные рынка','Open trading terminal':'Открыть торговый терминал','See rankings':'Посмотреть рейтинг','Open workspace':'Открыть рабочее пространство',
      'SYSTEM':'СИСТЕМА','ONLINE':'РАБОТАЕТ','MARKET':'РЫНОК','BINANCE LIVE FEED':'ПОТОК BINANCE','TRADING':'ТОРГОВЛЯ','PAPER ONLY':'ТОЛЬКО ДЕМО','Market overview — live and demonstration prices':'Обзор рынка — реальные и демонстрационные цены','Search assets, pairs…':'Поиск активов и пар…',
      'All':'Все','Crypto':'Криптовалюты','Forex':'Форекс','Stocks':'Акции','Commodities':'Сырьё','ASSET':'АКТИВ','PRICE':'ЦЕНА','24H':'24 Ч','VOLUME':'ОБЪЁМ','STATUS':'СТАТУС','LIVE':'LIVE','VIEW →':'ОТКРЫТЬ →',

      'Page not found':'Страница не найдена','BACK HOME':'НА ГЛАВНУЮ','Profile':'Профиль','Settings':'Настройки','Updates from your trading terminal':'Обновления торгового терминала','Paper trades':'Демо-сделки','Balance':'Баланс','Loading…':'Загрузка…','Close':'Закрыть','CLOSE':'ЗАКРЫТЬ','Buy':'Купить','Sell':'Продать','Amount':'Сумма','Leverage':'Плечо','Open position':'Открыть позицию','No positions open':'Нет открытых позиций'
    }
  };
  function translateString(src,lang){
    if(lang==='en') return src;
    const table=dict[lang]||{};
    if(Object.prototype.hasOwnProperty.call(table,src.trim())){
      const leading=src.match(/^\s*/)?.[0]||'', trailing=src.match(/\s*$/)?.[0]||'';
      return leading+table[src.trim()]+trailing;
    }
    let result=src;
    Object.keys(table).sort((a,b)=>b.length-a.length).forEach(key=>{
      if(key.length>2) result=result.split(key).join(table[key]);
    });
    return result;
  }
  function walk(root,lang){
    if(!root)return;
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    let n;
    while((n=walker.nextNode())){
      const current=n.nodeValue;
      if(!current.trim() || n.parentElement?.closest('script,style,svg,code,pre'))continue;
      const previous=previousText.get(n);
      let source=originalText.get(n);
      if(source===undefined || (previous!==undefined && current!==previous)){
        source=current; originalText.set(n,source);
      }
      const out=translateString(source,lang);
      n.nodeValue=out; previousText.set(n,out);
    }
    root.querySelectorAll?.('input[placeholder],textarea[placeholder],[aria-label],[title]').forEach(el=>{
      ['placeholder','aria-label','title'].forEach(attr=>{
        if(!el.hasAttribute(attr))return;
        const key='i18n_'+attr;
        if(!el.dataset[key])el.dataset[key]=el.getAttribute(attr);
        el.setAttribute(attr,translateString(el.dataset[key],lang));
      });
    });
  }
  let lang=localStorage.getItem('obsidian_language')||'en';
  if(!['uz','ru','en'].includes(lang))lang='en';
  function closePicker(){if(!picker)return;picker.classList.remove('open');trigger?.setAttribute('aria-expanded','false');}
  function setLanguage(next){
    if(!['uz','ru','en'].includes(next))return;
    lang=next;localStorage.setItem('obsidian_language',lang);document.documentElement.lang=lang;
    if(currentLabel)currentLabel.textContent=codeFor[lang];
    options.forEach(option=>{const selected=option.dataset.lang===lang;option.setAttribute('aria-selected',String(selected));const check=option.querySelector('.langCheck');if(check)check.textContent=selected?'✓':'';});
    walk(document.body,lang);closePicker();
  }
  trigger?.addEventListener('click',()=>{const isOpen=picker.classList.toggle('open');trigger.setAttribute('aria-expanded',String(isOpen));});
  options.forEach(option=>option.addEventListener('click',()=>setLanguage(option.dataset.lang)));
  document.addEventListener('click',event=>{if(picker&&!picker.contains(event.target))closePicker();});
  document.addEventListener('keydown',event=>{if(event.key==='Escape')closePicker();});
  document.documentElement.lang=lang;
  if(currentLabel)currentLabel.textContent=codeFor[lang];
  options.forEach(option=>{const selected=option.dataset.lang===lang;option.setAttribute('aria-selected',String(selected));const check=option.querySelector('.langCheck');if(check)check.textContent=selected?'✓':'';});
  const observer=new MutationObserver(records=>{
    records.forEach(r=>r.addedNodes.forEach(node=>{
      if(node.nodeType===Node.ELEMENT_NODE)walk(node,lang);
      else if(node.nodeType===Node.TEXT_NODE){
        if(!originalText.has(node))originalText.set(node,node.nodeValue);
        const src=originalText.get(node),out=translateString(src,lang);node.nodeValue=out;previousText.set(node,out);
      }
    }));
  });
  observer.observe(document.body,{childList:true,subtree:true});
  walk(document.body,lang);
})();
