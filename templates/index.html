<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OBSIDIAN LAB — Build. Trade. Compete.</title>
<style>
:root{
 --bg:#e7e3da;--card:#f1eee7;--ink:#151515;--muted:#77756e;--line:#d1cdc3;
 --accent:#b8ff3d;--green:#477743;--red:#c95757;--dark:#171717;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit}
a{text-decoration:none;color:inherit}
button,a{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:3px}
header{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 32px;gap:32px;position:sticky;top:0;z-index:50;background:rgba(231,227,218,.96);backdrop-filter:blur(12px)}
.logo{display:flex;align-items:center;gap:11px;font-size:12px;font-weight:800;letter-spacing:1.8px;white-space:nowrap}
.logoMark{width:31px;height:31px;border-radius:7px;background:var(--dark);color:#fff;display:grid;place-items:center;font-size:18px}
nav{display:flex;gap:29px;margin:auto}
nav a{font-size:12px;padding:26px 0;position:relative;color:#333}
nav a:hover{opacity:.55}
nav a.active{font-weight:700}
nav a.active:after{content:"";position:absolute;bottom:13px;left:0;right:0;height:2px;background:var(--ink)}
.headRight{display:flex;align-items:center;gap:12px}
.iconBtn{border:0;background:transparent;padding:8px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--dark);color:#fff;font-weight:700}
.menu{display:none}
main{max-width:1450px;margin:auto;padding:42px 4.5% 65px;min-height:calc(100vh - 130px)}
.hero{min-height:485px;display:flex;align-items:center;position:relative;overflow:hidden}
.heroText{max-width:650px;z-index:3}
.eyebrow{font-size:10px;letter-spacing:2px;font-weight:700}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:8px;box-shadow:0 0 0 3px rgba(184,255,61,.12)}
.hero h1{font-size:clamp(46px,6vw,78px);line-height:1.02;letter-spacing:-4px;margin:22px 0}
.hero p{max-width:450px;line-height:1.85;color:var(--muted);font-size:14px}
.heroArt{position:absolute;right:-3%;bottom:-80px;width:54%;height:600px;opacity:.98;background:
linear-gradient(140deg,transparent 0 28%,#343632 28% 31%,transparent 31% 34%,#1a1b19 34% 39%,transparent 39%),
linear-gradient(35deg,#121311 0 20%,#383a35 20% 33%,#171916 33% 48%,#51534d 48% 52%,#10110f 52% 72%,#2c2e2a 72% 100%);
clip-path:polygon(13% 100%,25% 67%,35% 60%,40% 40%,50% 32%,55% 16%,63% 7%,70% 13%,74% 32%,83% 41%,86% 68%,94% 78%,100% 100%);
}
.caption{position:absolute;right:12%;top:48%;z-index:4;color:#eee;letter-spacing:2px;font-size:10px;border-left:2px solid var(--accent);padding-left:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:6px;padding:12px 19px;font-size:11px;font-weight:700;transition:.18s}
.btn:hover{transform:translateY(-1px);opacity:.87}
.btn.light{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.green{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px;box-shadow:0 5px 18px rgba(0,0,0,.025)}
.navCard{min-height:145px;transition:.2s}
.navCard:hover{transform:translateY(-5px);box-shadow:0 12px 28px rgba(0,0,0,.07)}
.navCard .bigIcon{font-size:25px;margin-bottom:18px}
.navCard h3{margin:0 0 8px;font-size:14px}
.muted{color:var(--muted)}
.small{font-size:10px}
.status{display:flex;gap:80px;padding:30px 0}
.status strong{display:block;font-size:11px}
.status small{color:var(--muted);font-size:9px;letter-spacing:1px}
.pageHead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}
.pageHead h1{margin:0 0 6px;font-size:38px;letter-spacing:-2px}
.pageHead p{margin:0;color:var(--muted)}
.search{max-width:330px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:11px 12px}
label{font-size:10px;color:var(--muted);display:block;margin:13px 0 5px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:15px 17px;border-bottom:1px solid var(--line);font-size:11px}
th{color:var(--muted);font-weight:500;font-size:10px}
tr:last-child td{border-bottom:0}
.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.coin{width:30px;height:30px;border-radius:50%;background:var(--dark);color:var(--accent);display:inline-grid;place-items:center;font-weight:700;margin-right:9px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.pos{color:var(--green)}.neg{color:var(--red)}
.badge{font-size:9px;border:1px solid var(--line);padding:4px 7px;border-radius:4px}
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin:16px 0}
.tab{border:0;background:#d2cec455;padding:8px 13px;border-radius:5px;font-size:10px}
.tab.active{background:var(--dark);color:#fff}
.workspace{display:grid;grid-template-columns:185px 1fr;gap:30px}
.sidebar{border-right:1px solid var(--line);padding-right:20px}
.sidebar h4{font-size:10px;letter-spacing:1.8px;margin:8px 0 15px}
.sidebar a{display:flex;gap:11px;padding:11px 12px;border-radius:5px;font-size:11px;margin-bottom:4px}
.sidebar a.active{background:#d3d0c7;font-weight:700}
.stats .card{padding:20px}.statVal{font-size:27px;font-weight:700;letter-spacing:-1px}.statLabel{font-size:10px;color:var(--muted)}
.officeGrid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:18px}
.activity{padding:12px 0;border-bottom:1px solid var(--line)}
.activity:last-child{border:0}
.activity strong{font-size:12px}
.activity small{display:block;color:var(--muted);margin-top:2px}
.progress{height:5px;background:var(--line);border-radius:5px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green)}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{min-height:83px;border:1px solid var(--line);padding:7px;border-radius:4px;font-size:10px}
.event{display:block;background:rgba(184,255,61,.3);padding:3px;margin-top:5px}
.chart{height:300px;position:relative;overflow:hidden}
.chart svg{width:100%;height:100%}
.auth{max-width:980px;margin:30px auto;display:grid;grid-template-columns:1fr 1fr}
.authArt{background:var(--dark);color:#fff;padding:42px;border-radius:10px 0 0 10px;display:flex;flex-direction:column;justify-content:space-between}
.authForm{background:var(--card);padding:42px;border-radius:0 10px 10px 0}
.authForm h1{font-size:31px;margin:0 0 7px}
.modalBack{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:100;padding:20px}
.modalBack.show{display:grid}
.modal{background:var(--card);width:min(600px,100%);max-height:90vh;overflow:auto;border-radius:11px;border:1px solid var(--line);padding:25px}
.toast{position:fixed;right:20px;bottom:20px;background:var(--dark);color:#fff;padding:14px 20px;border-radius:7px;display:none;z-index:200}
.toast.show{display:block}
footer{border-top:1px solid var(--line);padding:20px 4.5%;display:flex;justify-content:space-between;color:var(--muted);font-size:9px;letter-spacing:1px}
.empty{text-align:center;padding:50px;color:var(--muted)}
.hide{display:none!important}
@media(max-width:1050px){nav{gap:17px}.g4{grid-template-columns:repeat(2,1fr)}.officeGrid{grid-template-columns:1fr 1fr}.terminal{grid-template-columns:1fr!important}.heroArt{opacity:.35;width:70%}}
@media(max-width:720px){
 header{height:64px;padding:0 17px;gap:10px}.menu{display:block}.headRight{margin-left:auto}nav{display:none;position:absolute;top:64px;left:0;right:0;background:var(--bg);padding:15px 20px;border-bottom:1px solid var(--line);flex-direction:column;gap:4px}nav.open{display:flex}nav a{padding:10px}nav a.active:after{display:none}
 main{padding:25px 17px 45px}.hero{min-height:510px;align-items:flex-start}.hero h1{font-size:43px;letter-spacing:-2px}.heroArt{bottom:-10px;width:90%;height:340px}.caption{display:none}.g4,.g3,.g2,.officeGrid,.auth{grid-template-columns:1fr}.status{gap:22px;flex-wrap:wrap}.pageHead{align-items:flex-start;flex-direction:column}.workspace{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line);padding:0 0 8px;display:flex;overflow:auto}.sidebar h4{display:none}.sidebar a{white-space:nowrap}.auth{margin:0}.authArt{min-height:170px;border-radius:10px 10px 0 0;padding:25px}.authForm{border-radius:0 0 10px 10px;padding:26px}footer{gap:12px;flex-direction:column}
}
</style>
</head>
<body>
<header>
<a class="logo" href="#/"><span class="logoMark">◈</span> OBSIDIAN LAB</a>
<nav id="nav">
<a data-route="/" href="#/">Home</a><a data-route="/markets" href="#/markets">Markets</a><a data-route="/trade" href="#/trade">Trade</a><a data-route="/leaderboard" href="#/leaderboard">Leaderboard</a><a data-route="/web-office" href="#/web-office">Web Office</a>
</nav>
<div class="headRight">
<button class="iconBtn" onclick="go('/notifications')" aria-label="Notifications">♧</button>
<a id="avatar" class="avatar" href="#/login">↗</a>
<button class="iconBtn menu" id="menuBtn">☰</button>
</div>
</header>
<main id="app"></main>
<footer><span>OBSIDIAN LAB © 2026 — A HIGHER STANDARD</span><span>PAPER TRADING · DEMO MARKET DATA</span></footer>
<div id="modalBack" class="modalBack"><div id="modal" class="modal"></div></div>
<div id="toast" class="toast"></div>

<script>
const state={user:JSON.parse(localStorage.getItem('obsidian_user')||'null'),trades:JSON.parse(localStorage.getItem('obsidian_trades')||'[]'),balance:Number(localStorage.getItem('obsidian_balance')||100000),tasks:JSON.parse(localStorage.getItem('obsidian_tasks')||'[]'),projects:JSON.parse(localStorage.getItem('obsidian_projects')||'[]'),events:JSON.parse(localStorage.getItem('obsidian_events')||'[]')};
const assets=[
['BTC','Bitcoin',67843.20,2.41,'92.8B'],['ETH','Ethereum',3241.10,1.18,'12.1B'],['SOL','Solana',154.32,-0.82,'4.08B'],['BNB','BNB',583.44,.56,'3.10B'],['XRP','XRP',.6121,3.12,'2.98B'],['ADA','Cardano',.4233,-1.04,'1.78B'],['DOGE','Dogecoin',.1582,1.30,'1.48B'],['AVAX','Avalanche',28.41,2.18,'1.28B']
];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:Number(n)<1?4:2}).format(Number(n)||0);
function save(){localStorage.setItem('obsidian_user',JSON.stringify(state.user));localStorage.setItem('obsidian_trades',JSON.stringify(state.trades));localStorage.setItem('obsidian_balance',state.balance);localStorage.setItem('obsidian_tasks',JSON.stringify(state.tasks));localStorage.setItem('obsidian_projects',JSON.stringify(state.projects));localStorage.setItem('obsidian_events',JSON.stringify(state.events))}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove('show'),2600)}
function go(p){location.hash='#'+p;closeModal()}
function route(){const p=(location.hash.slice(1)||'/').split('?')[0]||'/';document.querySelectorAll('[data-route]').forEach(a=>a.classList.toggle('active',a.dataset.route===p||(a.dataset.route!=='/'&&p.startsWith(a.dataset.route))));document.getElementById('nav').classList.remove('open');render(p)}
function shell(title,sub,body,actions=''){return `<div class="pageHead"><div><div class="eyebrow">${title==='Web Office'?'WORK / PLAN / BUILD':'OBSIDIAN LAB'}</div><h1>${title}</h1><p>${sub}</p></div>${actions}</div>${body}`}
function stat(label,val){return `<div class="card"><div class="statVal">${esc(val)}</div><div class="statLabel">${esc(label)}</div></div>`}
function assetRow(a){return `<a href="#/markets/${a[0]}" class="row"><span class="coin">${a[0][0]}</span><span><strong>${a[0]}</strong><small class="muted" style="display:block">${a[1]}</small></span></a>`}
function render(p){
const app=document.getElementById('app');
if(p==='/'){app.innerHTML=`<section class="hero"><div class="heroText"><span class="eyebrow"><span class="dot"></span>SYSTEM ONLINE</span><h1>Build. Trade. Compete.</h1><p>A modern platform for traders, builders and ambitious minds. Explore markets, practice trading and build your next opportunity.</p><div class="row" style="margin-top:27px"><a class="btn" href="#/register">GET STARTED →</a><a class="btn light" href="#/markets">EXPLORE MARKETS</a></div></div><div class="heroArt"></div><div class="caption">DISCIPLINE<br>CREATES<br>FREEDOM</div></section><section class="grid g4">${[['Markets','Explore market data','◫','/markets'],['Trade','Open trading terminal','↗','/trade'],['Leaderboard','See rankings','♛','/leaderboard'],['Web Office','Open workspace','▦','/web-office']].map(x=>`<a class="card navCard" href="#${x[3]}"><div class="bigIcon">${x[2]}</div><h3>${x[0]}</h3><small class="muted">${x[1]} <span style="float:right">→</span></small></a>`).join('')}</section><div class="status"><div><small><span class="dot"></span>SYSTEM</small><strong>ONLINE</strong></div><div><small><span class="dot"></span>MARKET</small><strong>DEMO DATA</strong></div><div><small><span class="dot"></span>TRADING</small><strong>PAPER ONLY</strong></div></div>`;return}
if(p==='/markets'){renderMarkets();return}
if(p.startsWith('/markets/')){renderTrade(p.split('/')[2].toUpperCase());return}
if(p==='/trade'){renderTrade('BTC');return}
if(p==='/leaderboard'){renderLeaderboard();return}
if(p==='/web-office'||p.startsWith('/web-office/')){renderOffice(p);return}
if(p==='/login'||p==='/register'||p==='/forgot-password'){renderAuth(p);return}
if(p==='/profile'||p.startsWith('/profile/')){renderProfile();return}
if(p==='/settings'||p.startsWith('/settings/')){renderSettings(p);return}
if(p==='/notifications'){renderNotifications();return}
if(p==='/admin'||p.startsWith('/admin/')){renderAdmin(p);return}
app.innerHTML=`<div class="empty"><h2>Page not found</h2><a class="btn" href="#/">BACK HOME</a></div>`;
}
function renderMarkets(){
let q='';let cat='All';
document.getElementById('app').innerHTML=shell('Markets','Market overview — demonstration prices',`<div class="row between"><input id="mq" class="search" placeholder="Search assets, pairs…"><div class="tabs" id="cats">${['All','Crypto','Forex','Stocks','Commodities'].map(x=>`<button class="tab ${x===cat?'active':''}" data-cat="${x}">${x}</button>`).join('')}</div></div><div id="mt"></div><p class="muted small" style="margin-top:18px">Prices are synthetic demo data. No live exchange connection is active.</p>`);
const draw=()=>{const rows=assets.filter(a=>(cat==='All'||cat==='Crypto')&&(a[0]+' '+a[1]).toLowerCase().includes(q));document.getElementById('mt').innerHTML=`<div class="tableWrap"><table><thead><tr><th>ASSET</th><th>PRICE</th><th>24H</th><th>VOLUME</th><th>STATUS</th><th></th></tr></thead><tbody>${rows.map(a=>`<tr><td>${assetRow(a)}</td><td>${money(a[2])}</td><td class="${a[3]>=0?'pos':'neg'}">${a[3]>0?'+':''}${a[3]}%</td><td>${a[4]}</td><td><span class="badge">DEMO</span></td><td><a class="btn light" style="padding:7px 10px" href="#/markets/${a[0]}">VIEW →</a></td></tr>`).join('')}</tbody></table></div>`;document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;draw()})};
document.getElementById('mq').oninput=e=>{q=e.target.value.toLowerCase();draw()};draw()
}
function lineChart(values){
const w=800,h=270,p=15,min=Math.min(...values),max=Math.max(...values),range=max-min||1;
const pts=values.map((v,i)=>`${p+i*(w-2*p)/(values.length-1)},${h-p-(v-min)/range*(h-2*p)}`).join(' ');
return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="M ${pts}" fill="none" stroke="#477743" stroke-width="3"/><path d="M ${pts} L ${w-p},${h} L ${p},${h} Z" fill="#477743" opacity=".08"/></svg>`
}
function renderTrade(sym){
const a=assets.find(x=>x[0]===sym)||assets[0];let side='BUY',type='MARKET';
const history=Array.from({length:50},(_,i)=>a[2]*(1+.018*Math.sin(i*.45)+.0005*i));
document.getElementById('app').innerHTML=shell(sym+' / USDT',a[1]+' · PAPER TRADING · DEMO QUOTES',`<div class="grid" style="grid-template-columns:180px minmax(0,1fr) 285px"><aside class="card"><h3>Markets</h3>${assets.map(assetRow).join('')}</aside><section class="card"><div class="row between"><div style="font-size:32px;font-weight:700">${money(a[2])}</div><span class="${a[3]>=0?'pos':'neg'}">${a[3]>0?'+':''}${a[3]}%</span></div><div class="chart">${lineChart(history)}</div><div class="row between muted small"><span>Volume ${a[4]}</span><span>DEMO MARKET</span></div></section><aside class="card"><h3>Trade</h3><div class="tabs"><button class="tab active" id="buy">BUY</button><button class="tab" id="sell">SELL</button></div><div class="tabs"><button class="tab active" id="market">MARKET</button><button class="tab" id="limit">LIMIT</button></div><form id="tradeForm"><label>Amount · ${sym}</label><input id="amount" type="number" step="any" min="0" placeholder="0.00" required><label>Price · USDT</label><input id="price" type="number" step="any" value="${a[2]}" ${type==='MARKET'?'disabled':''} required><p class="row between"><span class="muted">Available</span><strong>${money(state.balance)}</strong></p><button class="btn green full" style="width:100%">PLACE PAPER ORDER</button></form><p class="small muted" style="margin-top:15px">No real money. Long-only paper simulation.</p></aside></div><div class="tabs" style="margin-top:22px"><button class="tab active">Open Orders</button><button class="tab">Order History</button><button class="tab">Positions</button><button class="tab">Overview</button></div><div class="card"><h2>Recent activity</h2>${state.trades.length?state.trades.slice(-6).reverse().map(t=>`<div class="activity row between"><span><strong>${t.side}</strong> ${t.amount} ${t.symbol}</span><span>${money(t.price)}</span></div>`).join(''): '<div class="empty">No paper trades yet.</div>'}</div>`);
document.getElementById('buy').onclick=()=>{side='BUY';document.getElementById('buy').classList.add('active');document.getElementById('sell').classList.remove('active')};
document.getElementById('sell').onclick=()=>{side='SELL';document.getElementById('sell').classList.add('active');document.getElementById('buy').classList.remove('active')};
document.getElementById('market').onclick=()=>{type='MARKET';document.getElementById('price').disabled=true;document.getElementById('price').value=a[2];document.getElementById('market').classList.add('active');document.getElementById('limit').classList.remove('active')};
document.getElementById('limit').onclick=()=>{type='LIMIT';document.getElementById('price').disabled=false;document.getElementById('limit').classList.add('active');document.getElementById('market').classList.remove('active')};
document.getElementById('tradeForm').onsubmit=e=>{e.preventDefault();if(!state.user){go('/login?next=/trade');toast('Sign in first');return}const amount=Number(document.getElementById('amount').value),price=Number(document.getElementById('price').value||a[2]);if(amount<=0||price<=0)return toast('Enter a valid amount and price');const total=amount*price;if(side==='BUY'&&total>state.balance)return toast('Insufficient paper balance');if(side==='BUY')state.balance-=total;else state.balance+=total;state.trades.push({symbol:sym,side,amount,price,total,time:new Date().toISOString()});save();toast(side+' order filled');renderTrade(sym)}
}
function renderLeaderboard(){
document.getElementById('app').innerHTML=shell('Leaderboard','Top paper traders on Obsidian Lab',`<div class="tabs"><button class="tab active">ALL TIME</button><button class="tab">MONTHLY</button><button class="tab">WEEKLY</button><button class="tab">TODAY</button></div><div class="tableWrap"><table><thead><tr><th>RANK</th><th>TRADER</th><th>REALIZED PROFIT</th><th>TRADES</th><th>WIN RATE</th><th>POINTS</th></tr></thead><tbody>${[['Jasur','+$18,420','142','71.2%','12,840'],['Alex','+$12,810','118','68.4%','10,440'],['Whale','+$9,740','91','66.8%','8,920'],['Sigma','+$7,230','76','64.1%','7,540'],['Faridov','+$5,110','62','61.3%','6,220']].map((x,i)=>`<tr><td><strong>#${i+1}</strong></td><td><a href="#/profile/${i+1}" class="row"><span class="avatar">${x[0][0]}</span><strong>${x[0]}</strong></a></td><td class="pos">${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td><td>${x[4]}</td></tr>`).join('')}</tbody></table></div>`)
}
const officeItems=[['Overview','','▦'],['Tasks','/tasks','☷'],['Projects','/projects','□'],['Team','/team','♙'],['Documents','/documents','▤'],['Calendar','/calendar','□'],['Analytics','/analytics','⌁']];
function officeSide(active){return `<aside class="sidebar"><h4>WEB OFFICE</h4>${officeItems.map(x=>`<a href="#/web-office${x[1]}" class="${active===x[1]?'active':''}">${x[2]} ${x[0]}</a>`).join('')}</aside>`}
function renderOffice(p){
const s=p.split('/')[2]||'';
if(!s){document.getElementById('app').innerHTML=`<div class="workspace">${officeSide('')}<section>${shell('Web Office','Your workspace at a glance',`<div class="grid g4 stats">${stat('Active tasks',state.tasks.filter(x=>x.status!=='DONE').length)}${stat('Ongoing projects',state.projects.length)}${stat('Team members',5)}${stat('Completion rate',state.tasks.length?Math.round(state.tasks.filter(x=>x.status==='DONE').length/state.tasks.length*100)+'%':'0%')}</div><div class="officeGrid" style="margin-top:18px"><div class="card"><div class="row between"><h2>Recent Activity</h2><a href="#/web-office/tasks">View all →</a></div>${state.tasks.slice(0,5).map(t=>`<div class="activity"><strong>${esc(t.title)}</strong><small>${esc(t.status||'TODO')}</small></div>`).join('')||'<div class="empty">Create your first task.</div>'}</div><div class="card"><h2>Upcoming</h2>${state.events.slice(0,5).map(e=>`<div class="activity"><strong>${esc(e.title)}</strong><small>${esc(e.date)}</small></div>`).join('')||'<div class="empty">No upcoming events.</div>'}</div><div class="card"><h2>September 2026</h2><div class="calendar">${Array.from({length:30},(_,i)=>`<div class="day"><strong>${i+1}</strong>${i===15?'<span class="event">Team sync</span>':''}${i===17?'<span class="event">Review</span>':''}</div>`).join('')}</div></div></div><div class="grid g2" style="margin-top:18px"><div class="card"><h2>Active Projects</h2>${[['Obsidian Terminal',78],['AI Trading Assistant',45],['Web Office v1.0',90],['Mobile App',20]].map(x=>`<div class="activity"><div class="row between"><strong>${x[0]}</strong><span>${x[1]}%</span></div><div class="progress"><i style="width:${x[1]}%"></i></div></div>`).join('')}</div><div class="card"><h2>Team Members</h2>${[['Jasur','ICT Market Analyst','Online'],['Alex','Algo & Quant Dev','Online'],['Mister Whale','Capital & Risk Manager','Busy'],['Faridov','Frontend Developer','Online'],['Sigma','Community Manager','Offline']].map(x=>`<div class="activity row between"><div class="row"><span class="avatar">${x[0][0]}</span><span><strong>${x[0]}</strong><small>${x[1]}</small></span></div><span class="badge">${x[2]}</span></div>`).join('')}</div></div>`)} </section></div>`;return}
if(s==='tasks'||s==='projects'||s==='team'||s==='documents'||s==='calendar'||s==='analytics'){renderOfficeSection(s);return}
}
function renderOfficeSection(s){
let title=s[0].toUpperCase()+s.slice(1), content='';
if(s==='tasks')content=`<div class="row between"><p class="muted">Plan and track your work.</p><button class="btn" onclick="newOffice('task')">+ NEW TASK</button></div><div class="grid g3" style="margin-top:20px">${['TODO','IN PROGRESS','DONE'].map(st=>`<div><div class="eyebrow">${st}</div>${state.tasks.filter(t=>t.status===st).map(t=>`<div class="card" style="margin-top:10px"><strong>${esc(t.title)}</strong><p class="small muted">${esc(t.description||'')}</p><span class="badge">${esc(t.priority||'MEDIUM')}</span><div class="row" style="margin-top:12px"><button class="btn light" style="padding:6px 9px" onclick="editTask('${t.id}')">EDIT</button><button class="btn light" style="padding:6px 9px" onclick="deleteTask('${t.id}')">DELETE</button></div></div>`).join('')||'<div class="empty">No tasks</div>'}</div>`).join('')}</div>`;
if(s==='projects')content=`<div class="row between"><p class="muted">Projects and progress.</p><button class="btn" onclick="newOffice('project')">+ NEW PROJECT</button></div><div class="grid g2" style="margin-top:20px">${state.projects.map(p=>`<div class="card"><h2>${esc(p.title)}</h2><p class="muted">${esc(p.description||'')}</p><div class="progress"><i style="width:${p.progress||0}%"></i></div><p class="small">${p.progress||0}% complete</p><button class="btn light" onclick="deleteProject('${p.id}')">DELETE</button></div>`).join('')||'<div class="empty">Create your first project.</div>'}</div>`;
if(s==='team')content=`<div class="card">${[['Jasur','ICT Market Analyst','Online'],['Alex','Algo & Quant Dev','Online'],['Mister Whale','Capital & Risk Manager','Busy'],['Faridov','Frontend Developer','Online'],['Sigma','Community Manager','Offline']].map(x=>`<div class="activity row between"><div class="row"><span class="avatar">${x[0][0]}</span><span><strong>${x[0]}</strong><small>${x[1]}</small></span></div><span class="badge">${x[2]}</span></div>`).join('')}</div>`;
if(s==='documents')content=`<div class="card"><h2>Documents</h2><p class="muted">Local workspace documents.</p><button class="btn" onclick="newOffice('document')">+ NEW DOCUMENT</button><div class="empty">No documents yet.</div></div>`;
if(s==='calendar')content=`<div class="card"><div class="row between"><h2>Calendar</h2><button class="btn" onclick="newOffice('event')">+ NEW EVENT</button></div><div class="calendar" style="margin-top:18px">${Array.from({length:30},(_,i)=>`<div class="day"><strong>${i+1}</strong>${state.events.filter(e=>Number(e.day)===i+1).map(e=>`<span class="event">${esc(e.title)}</span>`).join('')}</div>`).join('')}</div></div>`;
if(s==='analytics')content=`<div class="grid g3 stats">${stat('Tasks completed',state.tasks.filter(t=>t.status==='DONE').length)}${stat('Projects',state.projects.length)}${stat('Paper trades',state.trades.length)}</div><div class="card" style="margin-top:18px"><h2>Trading performance</h2><div class="chart">${lineChart(Array.from({length:35},(_,i)=>i*1.5+Math.sin(i*.6)*7))}</div></div>`;
document.getElementById('app').innerHTML=`<div class="workspace">${officeSide('/'+s)}<section>${shell(title,'Web Office workspace',content)}</section></div>`
}
function newOffice(type){
let title=type==='task'?'New task':type==='project'?'New project':type==='event'?'New event':'New document';
showModal(`<h2>${title}</h2><label>Title</label><input id="omTitle"><label>Description</label><textarea id="omDesc"></textarea>${type==='task'?'<label>Status</label><select id="omStatus"><option>TODO</option><option>IN PROGRESS</option><option>DONE</option></select>':''}${type==='project'?'<label>Progress %</label><input id="omProgress" type="number" min="0" max="100" value="0">':''}${type==='event'?'<label>Day in September</label><input id="omDay" type="number" min="1" max="30" value="16">':''}<button class="btn green" style="width:100%;margin-top:20px" onclick="saveOffice('${type}')">SAVE</button>`)
}
function saveOffice(type){
const title=document.getElementById('omTitle').value.trim();if(!title)return toast('Title required');
if(type==='task')state.tasks.push({id:Date.now()+'',title,description:document.getElementById('omDesc').value,status:document.getElementById('omStatus').value,priority:'MEDIUM'});
if(type==='project')state.projects.push({id:Date.now()+'',title,description:document.getElementById('omDesc').value,progress:Number(document.getElementById('omProgress').value)||0});
if(type==='event')state.events.push({id:Date.now()+'',title,day:Number(document.getElementById('omDay').value)||16,date:'2026-09-'+String(Number(document.getElementById('omDay').value)||16).padStart(2,'0')});
save();closeModal();toast('Saved');render(location.hash.slice(1)||'/web-office')
}
function editTask(id){const t=state.tasks.find(x=>x.id===id);showModal(`<h2>Edit task</h2><label>Title</label><input id="et" value="${esc(t.title)}"><label>Status</label><select id="es"><option ${t.status==='TODO'?'selected':''}>TODO</option><option ${t.status==='IN PROGRESS'?'selected':''}>IN PROGRESS</option><option ${t.status==='DONE'?'selected':''}>DONE</option></select><button class="btn green" style="width:100%;margin-top:20px" onclick="updateTask('${id}')">SAVE</button>`)}
function updateTask(id){const t=state.tasks.find(x=>x.id===id);t.title=document.getElementById('et').value;t.status=document.getElementById('es').value;save();closeModal();render('/web-office/tasks')}
function deleteTask(id){state.tasks=state.tasks.filter(x=>x.id!==id);save();render('/web-office/tasks')}
function deleteProject(id){state.projects=state.projects.filter(x=>x.id!==id);save();render('/web-office/projects')}
function showModal(html){document.getElementById('modal').innerHTML=`<div class="row between"><span></span><button class="iconBtn" onclick="closeModal()">✕</button></div>${html}`;document.getElementById('modalBack').classList.add('show')}
function closeModal(){document.getElementById('modalBack').classList.remove('show')}
function renderAuth(p){
const login=p==='/login',register=p==='/register';
document.getElementById('app').innerHTML=`<section class="auth"><div class="authArt"><div class="logo">◈ OBSIDIAN LAB</div><div><h2>Build. Trade. Compete.</h2><p>Better decisions.<br>Bigger opportunities.</p></div></div><div class="authForm"><h1>${login?'Welcome back':'Create account'}</h1><p class="muted">${login?'Sign in to your account':'Your next chapter starts here'}</p><form id="authForm">${register?'<label>Full name</label><input id="aname" required><label>Username</label><input id="auser" required>':''}<label>Email</label><input id="aemail" type="email" required><label>Password</label><input id="apass" type="password" required><button class="btn green" style="width:100%;margin-top:20px">${login?'SIGN IN':'CREATE ACCOUNT'}</button></form><p class="notice">Demo authentication is stored locally in this single-file version. Connect your existing Telegram/Sheets backend when ready.</p><p style="margin-top:20px">${login?'No account? <a href="#/register"><strong>REGISTER</strong></a>':'Already have an account? <a href="#/login"><strong>SIGN IN</strong></a>'}</p></div></section>`;
document.getElementById('authForm').onsubmit=e=>{e.preventDefault();const email=document.getElementById('aemail').value;state.user={name:register?document.getElementById('aname').value:email.split('@')[0],username:register?document.getElementById('auser').value:email.split('@')[0],email};save();updateAvatar();toast('Signed in');go('/profile')}
}
function renderProfile(){
if(!state.user){go('/login');return}
document.getElementById('app').innerHTML=shell('Profile','Your information and paper trading statistics',`<div class="grid g2"><div class="card"><div class="row"><span class="avatar" style="width:72px;height:72px;font-size:25px">${state.user.username[0].toUpperCase()}</span><div><h2>${esc(state.user.name)}</h2><p class="muted">@${esc(state.user.username)}</p><button class="btn light" onclick="go('/settings/profile')">EDIT PROFILE</button></div></div></div><div class="grid g4">${stat('Balance',money(state.balance))}${stat('Trades',state.trades.length)}${stat('Points',state.trades.length*50)}${stat('Rank','#—')}</div></div><div class="card" style="margin-top:18px"><h2>Performance</h2><div class="chart">${lineChart(Array.from({length:30},(_,i)=>i+Math.sin(i*.5)*4))}</div></div><div class="card" style="margin-top:18px"><h2>Recent Activity</h2>${state.trades.slice(-8).reverse().map(t=>`<div class="activity row between"><span>${t.side} ${t.amount} ${t.symbol}</span><span>${money(t.price)}</span></div>`).join('')||'<div class="empty">No activity yet.</div>'}</div>`)
}
function renderSettings(p){
if(!state.user){go('/login');return}
const s=p.split('/')[2]||'profile';
const links=[['Profile','profile'],['Security','security'],['Notifications','notifications'],['Integrations','integrations'],['Appearance','appearance']];
let content='';
if(s==='profile')content=`<form id="sf"><label>Full name</label><input id="sn" value="${esc(state.user.name)}"><label>Username</label><input id="su" value="${esc(state.user.username)}"><button class="btn" style="margin-top:20px">SAVE CHANGES</button></form>`;
if(s==='security')content=`<label>Current password</label><input type="password"><label>New password</label><input type="password"><button class="btn" style="margin-top:20px" onclick="toast('Security settings saved')">SAVE</button>`;
if(s==='notifications')content=`<label><input type="checkbox" checked style="width:auto"> Email alerts</label><label><input type="checkbox" checked style="width:auto"> Trading notifications</label><button class="btn" onclick="toast('Preferences saved')">SAVE</button>`;
if(s==='integrations')content=`<div class="grid g2">${['Telegram','Google Sheets','Google Drive','Google Calendar','Discord','Email'].map(x=>`<div class="card"><div class="row between"><strong>${x}</strong><span class="badge">NOT CONFIGURED</span></div><p class="muted small">Credentials stay server-side.</p><button class="btn light" onclick="toast('${x}: configure on server')">CONFIGURE</button></div>`).join('')}</div>`;
if(s==='appearance')content=`<label>Theme</label><select><option>Warm Stone</option><option>Dark</option></select><label>Density</label><select><option>Comfortable</option><option>Compact</option></select><button class="btn" onclick="toast('Appearance saved')">SAVE</button>`;
document.getElementById('app').innerHTML=`<div class="workspace"><aside class="sidebar"><h4>SETTINGS</h4>${links.map(x=>`<a href="#/settings/${x[1]}" class="${s===x[1]?'active':''}">${x[0]}</a>`).join('')}</aside><section>${shell(s[0].toUpperCase()+s.slice(1),'Your account, preferences and integrations',`<div class="card">${content}</div><button class="btn light" style="margin-top:18px" onclick="logout()">SIGN OUT</button>`)} </section></div>`;
if(s==='profile')document.getElementById('sf').onsubmit=e=>{e.preventDefault();state.user.name=document.getElementById('sn').value;state.user.username=document.getElementById('su').value;save();updateAvatar();toast('Profile saved')}
}
function logout(){state.user=null;save();updateAvatar();go('/')}
function renderNotifications(){if(!state.user){go('/login');return}document.getElementById('app').innerHTML=shell('Notifications','Updates from your trading account and workspace',`<div class="card">${state.trades.length?state.trades.slice(-10).reverse().map(t=>`<div class="activity"><strong>Paper trade executed</strong><small>${t.side} ${t.amount} ${t.symbol} · ${new Date(t.time).toLocaleString()}</small></div>`).join(''):'<div class="empty">You are all caught up.</div>'}</div>`)}
function renderAdmin(p){if(!state.user){go('/login');return}const s=p.split('/')[2]||'overview';document.getElementById('app').innerHTML=`<div class="workspace"><aside class="sidebar"><h4>ADMIN CONSOLE</h4>${[['Overview',''],['Users','/users'],['Markets','/markets'],['Trades','/trades'],['Leaderboard','/leaderboard'],['Office','/office'],['Integrations','/integrations'],['Logs','/logs'],['Settings','/settings']].map(x=>`<a href="#/admin${x[1]}" class="${s===(x[1].slice(1)||'overview')?'active':''}">${x[0]}</a>`).join('')}</aside><section>${shell('Admin · '+s,'Server administration and system records',`<div class="grid g4">${stat('Users','1')}${stat('Paper trades',state.trades.length)}${stat('Volume',money(state.trades.reduce((n,t)=>n+t.total,0)))}${stat('Assets','8')}</div><div class="card" style="margin-top:18px"><h2>System status</h2><p><span class="dot"></span> Online · Demo market data · Paper trading only</p><p class="muted">Admin subpages are wired to real clickable routes in this single-file build.</p></div>`)} </section></div>`}
function updateAvatar(){const a=document.getElementById('avatar');if(state.user){a.textContent=state.user.username[0].toUpperCase();a.href='#/profile'}else{a.textContent='↗';a.href='#/login'}}
document.getElementById('menuBtn').onclick=()=>document.getElementById('nav').classList.toggle('open');
window.addEventListener('hashchange',route);window.addEventListener('load',()=>{updateAvatar();route()});
document.getElementById('modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')closeModal()});
</script>
</body>
</html>
