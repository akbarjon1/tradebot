<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OBSIDIAN LAB — Build. Trade. Compete.</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
 --bg:#e7e3da;--card:#f1eee7;--ink:#151515;--muted:#77756e;--line:#d1cdc3;
 --accent:#b8ff3d;--green:#477743;--red:#c95757;--dark:#171717;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit}
a{text-decoration:none;color:inherit}
button,a{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:3px}
header{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 32px;gap:32px;position:sticky;top:0;z-index:50;background:rgba(231,227,218,.96);backdrop-filter:blur(12px)}
.logo{display:flex;align-items:center;gap:11px;font-size:12px;font-weight:800;letter-spacing:1.8px;white-space:nowrap}
.logoMark{width:31px;height:31px;border-radius:7px;background:var(--dark);color:#fff;display:grid;place-items:center;font-size:18px}
nav{display:flex;gap:29px;margin:auto}
nav a{font-size:12px;padding:26px 0;position:relative;color:#333}
nav a:hover{opacity:.55}
nav a.active{font-weight:700}
nav a.active:after{content:"";position:absolute;bottom:13px;left:0;right:0;height:2px;background:var(--ink)}
.headRight{display:flex;align-items:center;gap:12px}
.iconBtn{border:0;background:transparent;padding:8px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--dark);color:#fff;font-weight:700}
.menu{display:none}
main{max-width:1450px;margin:auto;padding:42px 4.5% 65px;min-height:calc(100vh - 130px)}
.hero{min-height:485px;display:flex;align-items:center;position:relative;overflow:hidden}
.heroText{max-width:650px;z-index:3}
.eyebrow{font-size:10px;letter-spacing:2px;font-weight:700}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:8px;box-shadow:0 0 0 3px rgba(184,255,61,.12)}
.hero h1{font-size:clamp(46px,6vw,78px);line-height:1.02;letter-spacing:-4px;margin:22px 0}
.hero p{max-width:450px;line-height:1.85;color:var(--muted);font-size:14px}
.heroArt{position:absolute;right:-3%;bottom:-80px;width:54%;height:600px;opacity:.98;background:
linear-gradient(140deg,transparent 0 28%,#343632 28% 31%,transparent 31% 34%,#1a1b19 34% 39%,transparent 39%),
linear-gradient(35deg,#121311 0 20%,#383a35 20% 33%,#171916 33% 48%,#51534d 48% 52%,#10110f 52% 72%,#2c2e2a 72% 100%);
clip-path:polygon(13% 100%,25% 67%,35% 60%,40% 40%,50% 32%,55% 16%,63% 7%,70% 13%,74% 32%,83% 41%,86% 68%,94% 78%,100% 100%);
}
.caption{position:absolute;right:12%;top:48%;z-index:4;color:#eee;letter-spacing:2px;font-size:10px;border-left:2px solid var(--accent);padding-left:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:6px;padding:12px 19px;font-size:11px;font-weight:700;transition:.18s}
.btn:hover{transform:translateY(-1px);opacity:.87}
.btn.light{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.green{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px;box-shadow:0 5px 18px rgba(0,0,0,.025)}
.navCard{min-height:145px;transition:.2s}
.navCard:hover{transform:translateY(-5px);box-shadow:0 12px 28px rgba(0,0,0,.07)}
.navCard .bigIcon{font-size:25px;margin-bottom:18px}
.navCard h3{margin:0 0 8px;font-size:14px}
.muted{color:var(--muted)}
.small{font-size:10px}
.status{display:flex;gap:80px;padding:30px 0}
.status strong{display:block;font-size:11px}
.status small{color:var(--muted);font-size:9px;letter-spacing:1px}
.pageHead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}
.pageHead h1{margin:0 0 6px;font-size:38px;letter-spacing:-2px}
.pageHead p{margin:0;color:var(--muted)}
.search{max-width:330px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:11px 12px}
label{font-size:10px;color:var(--muted);display:block;margin:13px 0 5px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:15px 17px;border-bottom:1px solid var(--line);font-size:11px}
th{color:var(--muted);font-weight:500;font-size:10px}
tr:last-child td{border-bottom:0}
.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.coin{width:30px;height:30px;border-radius:50%;background:var(--dark);color:var(--accent);display:inline-grid;place-items:center;font-weight:700;margin-right:9px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.pos{color:var(--green)}.neg{color:var(--red)}
.badge{font-size:9px;border:1px solid var(--line);padding:4px 7px;border-radius:4px}
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin:16px 0}
.tab{border:0;background:#d2cec455;padding:8px 13px;border-radius:5px;font-size:10px}
.tab.active{background:var(--dark);color:#fff}
.workspace{display:grid;grid-template-columns:185px 1fr;gap:30px}
.sidebar{border-right:1px solid var(--line);padding-right:20px}
.sidebar h4{font-size:10px;letter-spacing:1.8px;margin:8px 0 15px}
.sidebar a{display:flex;gap:11px;padding:11px 12px;border-radius:5px;font-size:11px;margin-bottom:4px}
.sidebar a.active{background:#d3d0c7;font-weight:700}
.stats .card{padding:20px}.statVal{font-size:27px;font-weight:700;letter-spacing:-1px}.statLabel{font-size:10px;color:var(--muted)}
.officeGrid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:18px}
.activity{padding:12px 0;border-bottom:1px solid var(--line)}
.activity:last-child{border:0}
.activity strong{font-size:12px}
.activity small{display:block;color:var(--muted);margin-top:2px}
.chart{height:400px;position:relative;overflow:hidden;border-radius:8px}
.chart iframe{width:100%;height:100%;border:0}
.auth{max-width:980px;margin:30px auto;display:grid;grid-template-columns:1fr 1fr}
.authArt{background:var(--dark);color:#fff;padding:42px;border-radius:10px 0 0 10px;display:flex;flex-direction:column;justify-content:space-between}
.authForm{background:var(--card);padding:42px;border-radius:0 10px 10px 0}
.authForm h1{font-size:31px;margin:0 0 7px}
.modalBack{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:100;padding:20px}
.modalBack.show{display:grid}
.modal{background:var(--card);width:min(600px,100%);max-height:90vh;overflow:auto;border-radius:11px;border:1px solid var(--line);padding:25px}
.toast{position:fixed;right:20px;bottom:20px;background:var(--dark);color:#fff;padding:14px 20px;border-radius:7px;display:none;z-index:200}
.toast.show{display:block}
footer{border-top:1px solid var(--line);padding:20px 4.5%;display:flex;justify-content:space-between;color:var(--muted);font-size:9px;letter-spacing:1px}
.empty{text-align:center;padding:50px;color:var(--muted)}
@media(max-width:1050px){nav{gap:17px}.g4{grid-template-columns:repeat(2,1fr)}.officeGrid{grid-template-columns:1fr 1fr}.terminal{grid-template-columns:1fr!important}.heroArt{opacity:.35;width:70%}}
@media(max-width:720px){
 header{height:64px;padding:0 17px;gap:10px}.menu{display:block}.headRight{margin-left:auto}nav{display:none;position:absolute;top:64px;left:0;right:0;background:var(--bg);padding:15px 20px;border-bottom:1px solid var(--line);flex-direction:column;gap:4px}nav.open{display:flex}nav a{padding:10px}nav a.active:after{display:none}
 main{padding:25px 17px 45px}.hero{min-height:510px;align-items:flex-start}.hero h1{font-size:43px;letter-spacing:-2px}.heroArt{bottom:-10px;width:90%;height:340px}.caption{display:none}.g4,.g3,.g2,.officeGrid,.auth{grid-template-columns:1fr}.status{gap:22px;flex-wrap:wrap}.pageHead{align-items:flex-start;flex-direction:column}.workspace{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line);padding:0 0 8px;display:flex;overflow:auto}.sidebar h4{display:none}.sidebar a{white-space:nowrap}.auth{margin:0}.authArt{min-height:170px;border-radius:10px 10px 0 0;padding:25px}.authForm{border-radius:0 0 10px 10px;padding:26px}footer{gap:12px;flex-direction:column}
}
</style>
</head>
<body>
<header>
<a class="logo" href="#/" onclick="go('/')"><span class="logoMark">◈</span> OBSIDIAN LAB</a>
<nav id="nav">
<a data-route="/" href="#/" onclick="go('/')">Home</a>
<a data-route="/markets" href="#/markets" onclick="go('/markets')">Markets</a>
<a data-route="/trade" href="#/trade" onclick="go('/trade')">Trade</a>
<a data-route="/leaderboard" href="#/leaderboard" onclick="go('/leaderboard')">Leaderboard</a>
<a data-route="/web-office" href="#/web-office" onclick="go('/web-office')">Web Office</a>
</nav>
<div class="headRight">
<button class="iconBtn" onclick="go('/notifications')" aria-label="Notifications">♧</button>
<a id="avatar" class="avatar" href="#/login" onclick="go('/login')">↗</a>
<button class="iconBtn menu" id="menuBtn">☰</button>
</div>
</header>
<main id="app"></main>
<footer><span>OBSIDIAN LAB © 2026 — A HIGHER STANDARD</span><span>PAPER TRADING · DEMO MARKET DATA</span></footer>
<div id="modalBack" class="modalBack"><div id="modal" class="modal"></div></div>
<div id="toast" class="toast"></div>

<script>
let csrfToken = '';
const localUser = JSON.parse(localStorage.getItem('obsidian_user') || 'null');
const state = {
  user: localUser,
  balance: Number(localStorage.getItem('obsidian_balance') || 10000.0),
  trades: JSON.parse(localStorage.getItem('obsidian_trades') || '[]'),
  position: JSON.parse(localStorage.getItem('obsidian_pos') || 'null')
};

async function fetchAPI(url, options = {}) {
  const headers = new Headers(options.headers || {});
  if (!headers.has('Content-Type') && options.body) headers.set('Content-Type', 'application/json');
  const method = (options.method || 'GET').toUpperCase();
  const needsCsrf = ['POST', 'PATCH', 'PUT', 'DELETE'].includes(method)
    && !['/api/auth/login', '/api/auth/register', '/api/auth/telegram', '/api/auth/reset-request', '/api/auth/reset'].includes(url.split('?')[0]);
  const requestOptions = { ...options, method, headers, credentials: 'same-origin' };

  if (needsCsrf && !csrfToken) {
    try {
      const sessionResponse = await fetch('/api/session', { credentials: 'same-origin', cache: 'no-store' });
      const sessionData = await sessionResponse.json();
      csrfToken = sessionData.csrf || '';
    } catch(e) {
      return { status: 'error', message: e.message };
    }
  }

  if (needsCsrf && csrfToken) headers.set('X-CSRF-Token', csrfToken);
  try {
    let res = await fetch(url, requestOptions);
    let data = await res.json().catch(() => ({}));
    if (needsCsrf && res.status === 403 && data.message === 'Security token expired. Refresh the page and try again.') {
      csrfToken = '';
      const sessionResponse = await fetch('/api/session', { credentials: 'same-origin', cache: 'no-store' });
      const sessionData = await sessionResponse.json();
      csrfToken = sessionData.csrf || '';
      if (csrfToken) {
        headers.set('X-CSRF-Token', csrfToken);
        res = await fetch(url, requestOptions);
        data = await res.json().catch(() => ({}));
      }
    }
    return data;
  } catch(e) {
    return { status: 'error', message: e.message };
  }
}

function checkSessionBg() {
  fetchAPI('/api/session').then(data => {
    if (data && data.csrf) csrfToken = data.csrf;
    if (data && data.user) {
      state.user = data.user;
      state.balance = Number(data.user.balance || 10000.0);
      localStorage.setItem('obsidian_user', JSON.stringify(state.user));
      localStorage.setItem('obsidian_balance', state.balance);
      updateAvatar();
      refreshServerTradingState(true);
    }
  }).catch(()=>{});
}

async function refreshServerTradingState(renderNow = false) {
  if (!state.user) return;
  const previousPositionId = state.position?.id || null;
  const data = await fetchAPI('/api/paper-trades');
  if (!data || data.status !== 'success') return;
  const items = data.items || [];
  const open = items.find(t => t.status === 'OPEN');
  state.trades = items.filter(t => t.status === 'CLOSED').map(t => ({
    id:t.id, symbol:t.asset, side:t.side, amount:Number(t.amount), price:Number(t.exit_price),
    leverage:Number(t.leverage || 1), pnl:Number(t.pnl || 0), time:t.created_at, status:t.status
  }));
  state.position = open ? {
    id:open.id, symbol:open.asset, pair:open.asset+'USDT', type:open.side, size:Number(open.amount),
    leverage:Number(open.leverage || 1), entryPrice:Number(open.entry_price), tp:open.take_profit, sl:open.stop_loss
  } : null;
  state.balance = Number(data.balance);
  save();
  const positionChanged = previousPositionId !== (state.position?.id || null);
  if ((renderNow || positionChanged) && (location.hash.includes('/trade') || location.hash.includes('/markets/'))) render(location.hash.slice(1) || '/trade');
}

function requestKey() {
  return (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`);
}

const livePrices = { BTCUSDT: 78100.0, ETHUSDT: 2500.0 };

const assets = [
  ['BTC', 'Bitcoin', 78100.0, 2.41, '92.8B'],
  ['ETH', 'Ethereum', 2500.0, 1.18, '12.1B'],
  ['SOL', 'Solana', 154.32, -0.82, '4.08B'],
  ['BNB', 'BNB', 583.44, 0.56, '3.10B'],
  ['XRP', 'XRP', 0.6121, 3.12, '2.98B'],
  ['ADA', 'Cardano', 0.4233, -1.04, '1.78B'],
  ['DOGE', 'Dogecoin', 0.1582, 1.30, '1.48B'],
  ['AVAX', 'Avalanche', 28.41, 2.18, '1.28B']
];

const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money = n => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: Number(n) < 1 ? 4 : 2 }).format(Number(n) || 0);

function save() {
  localStorage.setItem('obsidian_user', JSON.stringify(state.user));
  localStorage.setItem('obsidian_trades', JSON.stringify(state.trades));
  localStorage.setItem('obsidian_balance', state.balance);
  localStorage.setItem('obsidian_pos', JSON.stringify(state.position));
}

async function syncBalance(newBal) {
  // Keep this browser-only demo state local. Server balance writes are disabled
  // until trades and ledger mutations are processed authoritatively on the server.
  state.balance = newBal;
  save();
}

function toast(t) {
  const x = document.getElementById('toast');
  if (!x) return;
  x.textContent = t;
  x.classList.add('show');
  clearTimeout(window.tt);
  window.tt = setTimeout(() => x.classList.remove('show'), 2600);
}

function go(p) {
  location.hash = '#' + p;
  closeModal();
  route();
}

function route() {
  let raw = location.hash.slice(1) || '/';
  if (!raw.startsWith('/')) raw = '/' + raw;
  const p = raw.split('?')[0] || '/';
  
  document.querySelectorAll('[data-route]').forEach(a => {
    a.classList.toggle('active', a.dataset.route === p || (a.dataset.route !== '/' && p.startsWith(a.dataset.route)));
  });
  const nav = document.getElementById('nav');
  if (nav) nav.classList.remove('open');
  render(p);
}

function shell(title, sub, body, actions = '') {
  return `<div class="pageHead"><div><div class="eyebrow">${title.includes('Office') ? 'TRADER CONTROL HUB' : 'OBSIDIAN LAB'}</div><h1>${title}</h1><p>${sub}</p></div>${actions}</div>${body}`;
}

function stat(label, val) {
  return `<div class="card"><div class="statVal">${esc(val)}</div><div class="statLabel">${esc(label)}</div></div>`;
}

function assetRow(a) {
  return `<a href="#/markets/${a[0]}" onclick="go('/markets/${a[0]}')" class="row"><span class="coin">${a[0][0]}</span><span><strong>${a[0]}</strong><small class="muted" style="display:block">${a[1]}</small></span></a>`;
}

function render(p) {
  const app = document.getElementById('app');
  if (!app) return;
  
  if (p === '/' || p === '') {
    app.innerHTML = `<section class="hero"><div class="heroText"><span class="eyebrow"><span class="dot"></span>SYSTEM ONLINE</span><h1>Build. Trade. Compete.</h1><p>A modern platform for traders, builders and ambitious minds. Explore markets, practice trading and build your next opportunity.</p><div class="row" style="margin-top:27px"><a class="btn" href="#/register" onclick="go('/register')">GET STARTED →</a><a class="btn light" href="#/markets" onclick="go('/markets')">EXPLORE MARKETS</a></div></div><div class="heroArt"></div><div class="caption">DISCIPLINE<br>CREATES<br>FREEDOM</div></section><section class="grid g4"><a class="card navCard" href="#/markets" onclick="go('/markets')"><div class="bigIcon">◫</div><h3>Markets</h3><small class="muted">Explore market data <span style="float:right">→</span></small></a><a class="card navCard" href="#/trade" onclick="go('/trade')"><div class="bigIcon">↗</div><h3>Trade</h3><small class="muted">Open trading terminal <span style="float:right">→</span></small></a><a class="card navCard" href="#/leaderboard" onclick="go('/leaderboard')"><div class="bigIcon">♛</div><h3>Leaderboard</h3><small class="muted">See rankings <span style="float:right">→</span></small></a><a class="card navCard" href="#/web-office" onclick="go('/web-office')"><div class="bigIcon">▦</div><h3>Web Office</h3><small class="muted">Open workspace <span style="float:right">→</span></small></a></section><div class="status"><div><small><span class="dot"></span>SYSTEM</small><strong>ONLINE</strong></div><div><small><span class="dot"></span>MARKET</small><strong>BINANCE LIVE FEED</strong></div><div><small><span class="dot"></span>TRADING</small><strong>PAPER ONLY</strong></div></div>`;
    return;
  }
  if (p === '/markets') { renderMarkets(); return; }
  if (p.startsWith('/markets/')) { renderTrade(p.split('/')[2].toUpperCase()); return; }
  if (p === '/trade') { renderTrade('BTC'); return; }
  if (p === '/leaderboard') { renderLeaderboard(); return; }
  if (p === '/web-office' || p.startsWith('/web-office/')) { renderOffice(p); return; }
  if (p === '/login' || p === '/register' || p === '/forgot-password') { renderAuth(p); return; }
  if (p === '/profile' || p.startsWith('/profile/')) { renderProfile(); return; }
  if (p === '/settings' || p.startsWith('/settings/')) { renderSettings(p); return; }
  if (p === '/notifications') { renderNotifications(); return; }
  if (p === '/admin' || p.startsWith('/admin/')) { renderAdmin(p); return; }
  app.innerHTML = `<div class="empty"><h2>Page not found</h2><a class="btn" href="#/" onclick="go('/')">BACK HOME</a></div>`;
}

function renderMarkets() {
  let q = ''; let cat = 'All';
  document.getElementById('app').innerHTML = shell('Markets', 'Market overview — live and demonstration prices', `<div class="row between"><input id="mq" class="search" placeholder="Search assets, pairs…"><div class="tabs" id="cats">${['All','Crypto','Forex','Stocks','Commodities'].map(x=>`<button class="tab ${x===cat?'active':''}" data-cat="${x}">${x}</button>`).join('')}</div></div><div id="mt"></div><p class="muted small" style="margin-top:18px">Live quotes from Binance API & Synthetic demo feed.</p>`);
  const draw = () => {
    const rows = assets.filter(a => (cat === 'All' || cat === 'Crypto') && (a[0] + ' ' + a[1]).toLowerCase().includes(q));
    document.getElementById('mt').innerHTML = `<div class="tableWrap"><table><thead><tr><th>ASSET</th><th>PRICE</th><th>24H</th><th>VOLUME</th><th>STATUS</th><th></th></tr></thead><tbody>${rows.map(a=>`<tr><td>${assetRow(a)}</td><td id="m-price-${a[0]}">${money(livePrices[a[0]+'USDT'] || a[2])}</td><td class="${a[3]>=0?'pos':'neg'}">${a[3]>0?'+':''}${a[3]}%</td><td>${a[4]}</td><td><span class="badge">LIVE</span></td><td><a class="btn light" style="padding:7px 10px" href="#/markets/${a[0]}" onclick="go('/markets/${a[0]}')">VIEW →</a></td></tr>`).join('')}</tbody></table></div>`;
    document.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { cat = b.dataset.cat; draw(); });
  };
  document.getElementById('mq').oninput = e => { q = e.target.value.toLowerCase(); draw(); };
  draw();
}

function renderTrade(sym) {
  const pair = (sym === 'ETH' ? 'ETHUSDT' : 'BTCUSDT');
  const a = assets.find(x => x[0] === sym) || assets[0];
  let side = 'LONG';
  let leverage = 10;
  const curPrice = livePrices[pair] || a[2];

  document.getElementById('app').innerHTML = shell(sym + ' / USDT', a[1] + ' · PAPER TRADING TERMINAL', `
    <div class="grid" style="grid-template-columns:180px minmax(0,1fr) 300px">
      <aside class="card">
        <h3>Markets</h3>
        ${assets.map(assetRow).join('')}
      </aside>

      <section class="card">
        <div class="row between">
          <div id="terminal-price" style="font-size:32px;font-weight:700">${money(curPrice)}</div>
          <span class="badge" style="background:var(--accent);color:#000">LIVE FEED</span>
        </div>
        <div class="chart" style="margin-top:14px">
          <iframe src="https://s.tradingview.com/widgetembed/?frameElementId=tradingview_widget&symbol=BINANCE%3A${pair}&interval=15&theme=light&style=1&timezone=Asia%2FTashkent"></iframe>
        </div>
        <div class="row between muted small" style="margin-top:12px">

window.closePosition = async function(reason = null) {
  if (!state.position) return;
  const p = state.position;
  if (!state.user) {
    const live = livePrices[p.pair] || p.entryPrice;
    let diff = (live - p.entryPrice) / p.entryPrice;
    if (p.type === 'SHORT') diff = -diff;
    const pnl = p.size * diff * p.leverage;
    state.trades.push({symbol:p.symbol,side:p.type,amount:p.size,price:live,leverage:p.leverage,pnl,time:new Date().toISOString()});
    state.position = null;
    await syncBalance(state.balance + Math.max(0, p.size + pnl));
    if (reason) toast(reason); else toast('Bitim yopildi!');
    render(location.hash.slice(1) || '/trade');
    return;
  }
  const closed = await fetchAPI(`/api/paper-trades/${encodeURIComponent(p.id)}/close`, {
    method:'POST', headers:{'Idempotency-Key':requestKey()}, body:JSON.stringify({})
  });
  if (!closed || closed.status !== 'success') return toast(closed?.message || 'Bitim yopilmadi.');
  await refreshServerTradingState(true);
  if (reason) toast(reason);
  else toast('Bitim yopildi!');
  render(location.hash.slice(1) || '/trade');
};

window.calcPositionSize = function() {
  const bal = parseFloat(document.getElementById('calc-balance').value) || 0;

  if (bal <= 0 || riskPct <= 0 || slPct <= 0) return toast('Barcha maydonlarni to‘ldiring!');

  const riskUSD = bal * (riskPct / 100);
  const posSize = riskUSD / (slPct / 100);
  const resBox = document.getElementById('calc-result');
  if (resBox) {
    resBox.style.display = 'block';
    resBox.innerHTML = `
      <strong>Maksimal yo‘qotish:</strong> <span class="neg">$${riskUSD.toFixed(2)}</span><br>

      <small class="muted">Agar narx Stop-Loss masofasiga (${slPct}%) yetsa, siz aynan $${riskUSD.toFixed(2)} yo'qotasiz.</small>

  }
};

async function appendServerJournalPage(reset = false) {

  try {

      serverJournalOffset = 0;
      serverJournalHasMore = false;
      list.replaceChildren();
      const sync = await fetchAPI('/api/journal/sync-trades', {method:'POST', body:JSON.stringify({})});
      if (!sync || sync.status !== 'success') throw new Error(sync?.message || 'Savdo tarixini sinxronlab bo‘lmadi');
    }
    const data = await fetchAPI(`/api/journal?limit=${SERVER_JOURNAL_PAGE_SIZE}&offset=${serverJournalOffset}`);
    if (!data || data.status !== 'success') throw new Error(data?.message || 'Jurnalni yuklab bo‘lmadi');
    (data.entries || []).forEach(entry => {
      const item = document.createElement('div');
      item.className = 'card'; item.style.marginTop = '8px';
      const title = document.createElement('strong');
      title.textContent = `${String(entry.type || 'entry').toUpperCase()} · ${entry.created_at || ''}`;
      const detail = document.createElement('pre');
      detail.style.whiteSpace = 'pre-wrap'; detail.textContent = JSON.stringify(entry.data || {}, null, 2);
      item.append(title, detail); list.appendChild(item);
    });
    serverJournalOffset += (data.entries || []).length;
    serverJournalHasMore = Boolean(data.pagination?.has_more);
    status.textContent = `${serverJournalOffset} / ${data.pagination?.total ?? serverJournalOffset} ta server yozuvi yuklandi.`;
    if (!data.pagination?.total) status.textContent = 'Server jurnali hozircha bo‘sh.';
    if (more) { more.hidden = !serverJournalHasMore; more.disabled = false; }
  } catch (e) {
    status.textContent = e.message || 'Server jurnaliga ulanib bo‘lmadi.';
    if (more) more.disabled = false;
  } finally { serverJournalBusy = false; }
}

async function loadServerJournal() { return appendServerJournalPage(true); }

};

window.runBacktest = async function() {
  const status = document.getElementById('bt-status');
  const results = document.getElementById('bt-results');
  const button = document.querySelector('button[onclick="runBacktest()"]');
  if (!status || !results) return;
  const symbol = document.getElementById('bt-symbol')?.value || 'BTCUSDT';
  const interval = document.getElementById('bt-interval')?.value || '1h';
  const limit = Number(document.getElementById('bt-limit')?.value || 200);
  if (!Number.isInteger(limit) || limit < 60 || limit > 500) {
    status.textContent = 'Shamlar soni 60 dan 500 gacha butun son bo‘lishi kerak.'; return;
  }
  status.textContent = 'Backtest ishlayapti…'; results.textContent = '';
  if (button) button.disabled = true;
  try {
    const data = await fetchAPI('/api/backtest', {method:'POST', body:JSON.stringify({symbol, interval, limit})});
    if (data.status !== 'success') throw new Error(data.message || 'Backtest API xatosi');
    const signed = n => `${Number(n) >= 0 ? '+' : ''}${Number(n).toFixed(2)}%`;
    results.innerHTML = `<div class="grid g3"><div class="card"><span class="muted small">Strategy return</span><h2>${signed(data.strategy_return_pct)}</h2></div><div class="card"><span class="muted small">Buy & hold</span><h2>${signed(data.buy_and_hold_return_pct)}</h2></div><div class="card"><span class="muted small">Max drawdown</span><h2>${Number(data.max_drawdown_pct).toFixed(2)}%</h2></div></div><p>Entries: <strong>${data.entries}</strong> · Profitable periods: <strong>${Number(data.profitable_periods_pct).toFixed(2)}%</strong> · Candles: ${data.candles}</p><p class="muted">${data.warning || 'Tarixiy simulyatsiya, prognoz emas.'}</p>`;
    status.textContent = `${symbol} · ${interval} backtest yakunlandi.`;
    try {
      await fetchAPI('/api/journal', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({type:'backtest', data:{symbol, interval, candles:data.candles, strategy_return_pct:data.strategy_return_pct, buy_and_hold_return_pct:data.buy_and_hold_return_pct, max_drawdown_pct:data.max_drawdown_pct, entries:data.entries, profitable_periods_pct:data.profitable_periods_pct}})});
    } catch (journalError) { console.warn('Server journal save failed', journalError); }
    try {
      const key = 'obsidian_backtest_journal_v1';
      const saved = JSON.parse(localStorage.getItem(key) || '[]');
      saved.unshift({at:new Date().toISOString(),symbol,interval,candles:data.candles,strategy_return_pct:data.strategy_return_pct,buy_and_hold_return_pct:data.buy_and_hold_return_pct,max_drawdown_pct:data.max_drawdown_pct,entries:data.entries,profitable_periods_pct:data.profitable_periods_pct});
      localStorage.setItem(key, JSON.stringify(saved.slice(0,100)));
    } catch (storageError) { console.warn('Backtest history could not be stored locally', storageError); }
  } catch (err) { status.textContent = err.message || 'Backtestni bajarib bo‘lmadi.'; }
  finally { if (button) button.disabled = false; }
};

async function runResearchAnalysis() {
  const symbolEl = document.getElementById('ai-market-symbol');
  const statusEl = document.getElementById('ai-analysis-status');
  if (!symbolEl || !statusEl) return;
  const symbol = symbolEl.value;
  const ids = ['jasur-analysis','alex-analysis','whale-analysis'];
  const labels = ['jasur-signal','alex-signal','whale-signal'];
  statusEl.textContent = `${symbol} uchun AI agentlar birgalikda tahlil qilmoqda…`;
  [...ids,...labels].forEach(id => { const el=document.getElementById(id); if(el) el.textContent='Tahlil bajarilmoqda…'; });
  const button = document.querySelector('button[onclick="runResearchAnalysis()"]');
  if (button) button.disabled = true;
  try {
    const data = await fetchAPI('/api/agents/room', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({symbol})
    });
    if (data.status !== 'success') throw new Error(data.message || 'Agent API xatosi');
    const entries = [
      ['jasur','Jasur'], ['alex','Alex'], ['whale','Mister Whale']
    ];
    entries.forEach(([key,name],i) => {
      const analysis = document.getElementById(ids[i]);
      const signal = document.getElementById(labels[i]);
      if (analysis) analysis.textContent = data.results?.[key] || `${name}: natija qaytmadi.`;
      if (signal) signal.textContent = key === 'whale' ? 'Risk ko‘rib chiqildi · order bajarilmadi' : 'AI tahlili yakunlandi';
    });
    statusEl.textContent = `Tahlil yakunlandi · ${symbol} · ${data.timeframe || '15m'} · ${new Date(data.updated_at || Date.now()).toLocaleTimeString()}. Faqat tahlil: order ochilmadi.`;
  } catch (err) {
    statusEl.textContent = err.message || 'Agentlar bilan bog‘lanib bo‘lmadi.';
    ids.forEach(id => { const el=document.getElementById(id); if(el) el.textContent='Tahlil hozir mavjud emas.'; });
    labels.forEach(id => { const el=document.getElementById(id); if(el) el.textContent='Natija olinmadi'; });
  } finally {
    if (button) button.disabled = false;
  }
}

async function updateBinancePrices() {
  try {
    if (state.user) {
      const quotes = await fetchAPI('/api/paper-prices');
      if (quotes.status === 'success') {
        livePrices.BTCUSDT = Number(quotes.prices.BTC);
        livePrices.ETHUSDT = Number(quotes.prices.ETH);
      }
    } else {
      const [btc, eth] = await Promise.all([
        fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT').then(r=>r.json()),
        fetch('https://api.binance.com/api/v3/ticker/price?symbol=ETHUSDT').then(r=>r.json())
      ]);
      if (btc.price) livePrices.BTCUSDT = Number(btc.price);
      if (eth.price) livePrices.ETHUSDT = Number(eth.price);
    }
  } catch (e) {
    // Keep the last known display quote. Trade execution is always server-priced.
  }

  const pBtc = document.getElementById('m-price-BTC');
  if (pBtc) pBtc.textContent = money(livePrices.BTCUSDT);
  const pEth = document.getElementById('m-price-ETH');
  if (pEth) pEth.textContent = money(livePrices.ETHUSDT);

  const termP = document.getElementById('terminal-price');
  if (termP) {
    const pair = location.hash.includes('ETH') ? 'ETHUSDT' : 'BTCUSDT';
    termP.textContent = money(livePrices[pair]);
  }

  if (state.position && !state.user) {
    const pos = state.position;
    const cur = livePrices[pos.pair] || pos.entryPrice;
    let diff = (cur - pos.entryPrice) / pos.entryPrice;
    if (pos.type === 'SHORT') diff = -diff;
    const pnl = pos.size * diff * pos.leverage;

    const pnlEl = document.getElementById('pos-pnl-val');
    if (pnlEl) {
      pnlEl.className = pnl >= 0 ? 'pos' : 'neg';
      pnlEl.innerHTML = `<strong>${pnl >= 0 ? '+' : ''}${money(pnl)} (${((pnl/pos.size)*100).toFixed(2)}%)</strong>`;
    }

    if (pos.type === 'LONG') {
      if (pos.tp && cur >= pos.tp) closePosition(`🎯 Take-Profit! Narx: $${cur}`);
      if (pos.sl && cur <= pos.sl) closePosition(`🛑 Stop-Loss! Narx: $${cur}`);
    } else {
      if (pos.tp && cur <= pos.tp) closePosition(`🎯 Take-Profit! Narx: $${cur}`);
      if (pos.sl && cur >= pos.sl) closePosition(`🛑 Stop-Loss! Narx: $${cur}`);
    }
  }
  if (state.user && state.position) refreshServerTradingState();
}
